SICH_ERKLAERUNG = "Für den <b>Umzug auf einen zweiten LoxBerry</b>: die Datei enthält alle Einstellungen dieses Plugins samt Aktionstoken und Sprechtoken und lässt sich dort wieder einspielen. Die Sprechtoken anderer Plugins, die dieses Plugin für seine Ansagen übernommen hat, stehen nicht darin; beim Zurückspielen bleiben die geltenden."
SICH_KOPF = "Sicherung der Einstellungen von Chromecast 4 Lox NG. Enthält das Aktionstoken und das Sprechtoken – vertraulich behandeln. Die Sprechtoken anderer Plugins stehen nicht darin; beim Zurückspielen bleiben die geltenden."
SICH_SCHREIBFEHLER = "Die Einstellungen ließen sich nicht schreiben."
SICH_WARNUNG = "<b>Die Datei enthält das Aktionstoken dieser Anlage</b> — das Merkwort, mit dem die Oberfläche fremde Formulare abweist — <b>und das Sprechtoken</b>, mit dem andere Plugins hier sprechen. Behandeln Sie die Datei vertraulich: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."
S_ABO_NOETIG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an</b> — einzutragen unter <i>System-Einstellungen → MQTT Gateway → Abonnements</i>:"
S_LOGIK_EINLEITUNG = "Zwei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein, am Beispiel des Lautsprechers <b>„Wohnzimmer“</b> mit dem Präfix <span class='sm-mono'>chromecast4lox</span> – so heißen die Bausteine im Musterprojekt. Für Ihre Lautsprecher und Ihr Präfix stehen die Namen in Schritt&nbsp;2, die Befehle in Schritt&nbsp;3. Die erste Seite zeigt Wiedergabe, Lautsprecher und Dienst und meldet Störungen – sie genügt für den Anfang. Die zweite legt Lautstärke, Favoriten, Befehle an alle Lautsprecher, eine Türklingel-Ansage und die Ansagensperre in die App. Jede Seite hat eigene Nummern. Alle Bausteine findet man in Loxone Config über die Baustein-Suche (F5)."
S_NAME_GENAU = "Der Name muss <b>genau</b> so lauten wie in der Google-Home-App. Im Reiter Test findet <i>Chromecasts im Netz suchen</i> die richtigen Schreibweisen. Aus dem Namen wird das MQTT-Thema gebildet — Umlaute und Leerzeichen werden dabei ersetzt."
S_SCHRITTWEITE_GILT = "Gilt für <span class='sm-mono'>volume_up</span> und <span class='sm-mono'>volume_down</span>."
S_UDPPORT_FEHLT = "Der <b>UDP-Eingangsport</b> des MQTT-Gateways ist nicht auffindbar. Die Ausgangsvorlage trägt dann Port 0 ein. Im Gateway unter <i>UDP In</i> einen Port setzen und die Vorlage neu erzeugen."
S_ZU_6 = "<b>Zu #8, #9, #11, #13 und #44 (und den Befehlen der zweiten Seite):</b> die Befehle stehen am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ des Musterprojekts (Adresse: UDP-Eingang des MQTT-Gateways); das Gateway macht daraus eine MQTT-Nachricht, die Befehlsbrücke dieses Plugins prüft sie und reicht sie an den Dienst. Jeder Befehl braucht den Haken „Befehle über MQTT annehmen“, alles Hörbare zusätzlich „Lautsprecher über MQTT steuern“ (Reiter MQTT).<br> <b>Zu #3, #4 und #14 bis #16:</b> überwacht wird der <b>Dienst</b>, nicht der Lautsprecher. <span class='sm-mono'>server/online</span> kommt retained mit Letztem Willen: stirbt der Dienst oder reißt seine Verbindung ab, setzt der Broker 0. <span class='sm-mono'>server/zaehler</span> zählt in jedem Takt eine Stelle weiter; bleibt er stehen, arbeitet der Dienst nicht mehr, auch wenn online noch 1 zeigt. Ein Lautsprecher geht von selbst in den Ruhezustand und meldet sich dann als nicht erreichbar — das ist ein Normalzustand, kein Ausfall.<br> <b>Zu #16:</b> Die Analogwertvalidierung meldet am Ausgang error, wenn innerhalb von Tmc kein neuer Wert kommt; beendet sich der Dienst, sendet er -1, und das liegt unter Min 0. Loxone Config beschriftet die Anschlüsse V, En, Tmc, Min, Max und am Ausgang E (in der Projektdatei inval, mintime, minval, maxval, error). Den Zähler #4 an V legen, nicht an En; an En die Konstante 1 (#5) (unbeschaltet steht En auf EIN). Der Ausgang E geht über das ODER (#17) an die Benachrichtigung.<br> <b>Zu allen Namen mit Wohnzimmer:</b> die Namen enthalten den Gerätenamen. <b>Wird das Gerät in der Google-Home-App umbenannt, ändern sich alle Themen</b> — dann hier den Namen nachziehen und die Virtuellen Eingänge nach der Namenstabelle umbenennen; der Befehlsname ändert sich mit."
