; cc_tts_modi() in cc_lib.php liefert die Schluesselnamen, und index.php ruft
; sie mit cc_t($cc_mt) auf. Eine Suche nach dem wortwoertlichen
; cc_t('TTS.M_CHROMECAST') findet sie deshalb NICHT - sie sehen dabei wie
; verwaiste Schluessel aus und sind es nicht. Wer sie loescht, bekommt im
; Auswahlkasten fuer die Ansageart die Schluesselnamen statt der Texte.
