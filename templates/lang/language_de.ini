L_QUELLEN = "Quellen (je Zeile: Nr = Art | Name | Adresse)"
H_QUELLEN_FELD = "Nummer 1 bis %d, gemeinsam für alle Zonen. Art <tt>radio</tt>: Stream-Adresse (http/https; .m3u und .pls werden aufgelöst, der Inhaltstyp kommt aus der Antwort). Art <tt>liste</tt>: Ordner oder M3U-Datei in der Medienablage (Ordner = alle Audiodateien alphabetisch, M3U = ihre Reihenfolge, höchstens 200 Titel); danach wirken Nächster/Voriger. Art <tt>datei</tt>: eine Datei der Ablage oder eine http-Adresse. Abspielbar sind <tt>.mp3</tt>, <tt>.m4a</tt>, <tt>.aac</tt>, <tt>.flac</tt>, <tt>.ogg</tt>/<tt>.oga</tt>/<tt>.opus</tt>, <tt>.wav</tt>, <tt>.webm</tt> und <tt>.mp4</tt> (bei Videos nur der Ton). In Loxone: Radiotasten, Ausgang auf <tt>zone_&lt;Nr&gt;/quelle</tt> (Wert = Nummer, 0 = Stopp)."
