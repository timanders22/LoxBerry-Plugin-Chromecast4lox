SICH_FEHLEND = "In der Datei fehlen %d Einstellungen: %s. Eine unvollständige Sicherung wird nicht zurückgespielt — sonst fielen die fehlenden Werte stillschweigend auf die Werkseinstellung zurück, ohne dass an der Oberfläche etwas davon zu sehen wäre."
