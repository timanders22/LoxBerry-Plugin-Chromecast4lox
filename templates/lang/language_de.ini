L_ABLAGE_WAHL = "Speicher der Medienablage"
H_ABLAGE_WAHL = "Zur Auswahl steht, was LoxBerry eingehängt hat: USB-Datenträger und Netzwerkfreigaben (LoxBerry: <i>Netzwerkfreigaben</i>, z. B. eine FRITZ!Box - siehe unten). Unter <i>Unterverzeichnis</i> den Ordner darin angeben, z. B. <tt>/Musik</tt>. <i>Benutzerdefinierter Pfad</i> nimmt einen anderen Ordner unter /media oder /mnt; ein bisheriger Pfad, der zu keinem Speicher passt, steht dort. Erst <i>Speichern</i> übernimmt die Wahl. Eine neu angelegte Freigabe erscheint, sobald LoxBerry sie erreicht (Seite neu laden)."
L_ABLAGE_ZIEL = "Wird gespeichert als:"
H_ABLAGE_HAND = "Erweitert: Pfad von Hand"
H_FRITZ = "Speicher an der FRITZ!Box als Netzwerkfreigabe einrichten"
FRITZ_HINWEIS = "<b>An der FRITZ!Box</b> (http://fritz.box): <i>Heimnetz → USB / Speicher → Speicher (NAS)</i> - „Speicher (NAS) aktiv“ einschalten. Unter <i>System → FRITZ!Box-Benutzer</i> einen Benutzer anlegen (oder einen vorhandenen nehmen) mit dem Recht „Zugang zu NAS-Inhalten“; Lesen genügt. <b>Im LoxBerry:</b> <i>Netzwerkfreigaben</i> → Server hinzufügen: Adresse <tt>192.168.178.1</tt> bzw. <tt>fritz.box</tt>, Typ SMB, Benutzername und Kennwort dieses FRITZ!Box-Benutzers. Danach steht die Freigabe (meist <tt>FRITZ.NAS</tt>) hier in der Auswahl; den Musikordner als Unterverzeichnis eintragen, z. B. <tt>/Musik</tt>. LoxBerry hängt die Freigabe bei Bedarf selbst ein (und nach 5 Minuten Ruhe wieder aus); der Webserver darf sie lesen. Freigegeben wird nur der gewählte Ordner, nur lesend - für Musik einen eigenen Unterordner nehmen, nicht die ganze Platte."
H_ABLAGE_FELD = "Ein Ordner, den LoxBerry selbst einhängt: USB-Datenträger (Speicherverwaltung) oder Netzfreigabe (Netzwerkfreigaben) - unter %s. Leer = keine Ablage. Ausgeliefert wird direkt vom Webserver des LoxBerry (mit Spulen), kein PHP im Datenweg."
L_ABLAGE_ZUSTAND = "Zustand laut Dienst:"
T_ABLAGE_OK = "freigegeben, %d Audiodateien"
T_ABLAGE_NEIN = "nicht freigegeben: %s"
