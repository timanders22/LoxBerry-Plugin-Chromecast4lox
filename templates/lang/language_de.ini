[LOX]

S0 = "MQTT ist der Weg des Musterprojekts für Werte <b>und</b> Befehle. Der HTTP-Endpunkt bleibt für andere Plugins (Sprachausgabe, unten)."
S1 = "<b>Werte: das MQTT-Gateway.</b> Der Dienst sendet direkt an den Broker; das Gateway gibt jeden Wert an den Virtuellen Eingang gleichen Namens weiter. Diese Eingänge legt man in Loxone Config mit genau diesem Titel an – das Gateway ordnet nur über den Namen zu. Was zu tun ist, hängt von seiner Fassung ab:"
S1_V1 = "Gateway V1: einzutragen ist nichts – die Abo-Datei liegt bei und trägt <span class='sm-mono'>%s</span>. Sie nimmt auch Befehle und Quittungen mit; kein Befehlstitel heißt wie ein Eingang, eine Schleife entsteht nicht. Wer das nicht will, nimmt V2."
S1_V1_FEHLT = "Gateway V1: die Abo-Datei trägt <span class='sm-mono'>%s</span> noch nicht – im Reiter MQTT einmal speichern."
S1_V2 = "Gateway V2: unter <i>Abonnements</i> in der Gruppe <span class='sm-mono'>%s</span> diese %d Datenpunkte anhaken (je weiterem Gerät 15 mehr):"
HAKEN_AUF = "Hakenliste: %d Datenpunkte"
T_NONCACHED = "Noncached"
S1_NONCACHED = "„Noncached“ nur für server/online: es kommt jede Minute mit dem gleichen Wert 1; V2 schickt nach einem Neustart des Miniservers sonst nur Geändertes, und die Ausfallmeldung zeigte „Dienst meldet sich nicht“ bis zur nächsten Änderung."
S1_RECONNECT = "Nach einem Neustart des Miniservers stellt das Gateway die Werte selbst wieder zu (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt: reconnect)."
S2 = "<b>Eingänge anlegen:</b> je Wert ein Virtueller Eingang (Peripherie → Virtuelle Eingänge), Titel <b>genau</b> wie in dieser Tabelle – keine Vorlage. Texte (Zustand, Titel, Interpret, Album, App, letzte Meldung) als Virtueller Texteingang. In Klammern der Befehlsname des Geräts für Schritt 3."
S2_KEINE_GERAETE = "Noch kein Gerät eingetragen – die Tabelle zeigt nur die Werte des Dienstes (Reiter Einstellungen)."
T_GERAET = "Gerät (Befehlsname)"
T_ART = "Art"
T_DIENST = "Dienst"
ART_TEXT = "Texteingang"
ART_ZAHL = "Eingang"
KOPIEREN = "kopieren"
KOPIERT = "kopiert"
S2_DIGITAL = "„Als Digitaleingang“ nicht anhaken – auch Ja/Nein-Werte (online, playing, muted …) kommen als Zahl 0/1."
S2_TEXT = "Texteingänge zeigen den Text, wie er kommt; „-“ heißt keine Aussage."
S2_FEHLWERT = "-1 heißt „unbekannt“: volume ohne gemeldete Lautstärke, volume, duration und favorit eines aus der Liste genommenen Geräts; dessen Ja/Nein-Werte gehen auf 0."
S2_RECHTE = "Der LoxBerry-Benutzer im Miniserver braucht Rechte auf diese Eingänge."
S2_UMBENENNEN = "Anderes Präfix oder anderer Gerätename = alle Namen neu. Umlaute werden umgeschrieben: „Küche“ → Thema „Kueche“ → Eingang chromecast4lox_Kueche_volume, Befehlsname „kueche“."
S3 = "<b>Befehle:</b> Loxone sendet „publish &lt;Thema&gt; &lt;Wert&gt;“ an den UDP-Eingang des MQTT-Gateways; die Befehlsbrücke dieses Plugins hört auf <span class='sm-mono'>%s</span>, prüft jeden Befehl und reicht ihn an den Dienst – dieselbe Stelle wie bisher (Sperre, Obergrenze, Ruhezeit, gleiche Lautstärke binnen 60 s)."
S3_HAKEN = "Für die Befehle im Reiter MQTT die Haken „Befehle über MQTT annehmen“ und – für alles Hörbare – „Lautsprecher über MQTT steuern“ setzen."
S3_KEINE = "Die Befehlsliste ist nicht lesbar (bin/befehlsbruecke.php oder bin/befehle_zuordnung.php fehlt oder ist defekt) – siehe Reiter Test."
S3_NICHTS = "Für Befehle ist unter Gateway V1 und V2 nichts einzutragen."
S3_ANSAGE = "Eine Ansage schickt Loxone mit festem Text (publish …/tts Es hat geklingelt) oder aus dem Status-Ausgang TQ; leer oder „0“ wird nicht gesprochen."
S3_SCHRITT = "lauter und leiser sind Pulse: um wie viel, stellt das Plugin ein (Reiter Einstellungen, Schrittweite) – die Vorlage muss danach nicht neu erzeugt werden. play setzt über MQTT nur fort; Medien startet man über Favoriten."
S3_VORLAGE = "Die Vorlage legt den Virtuellen Ausgang „Chromecast 4 Lox NG MQTT-Befehle“ an (/dev/udp/%s/%d) – je Gerät und „alle“ die Befehle ohne Ansage, dazu „Ansagen sperren“. EINMAL einlesen: Baum links Virtuelle Ausgänge → Menüband Vordefinierte Geräte → Vorlage Importieren…."
S4 = "<b>Ausfallerkennung:</b> Analogwertvalidierung an <span class='sm-mono'>%s</span> mit Tmc %d s (dreimal der Takt, mindestens 180 s), Min 0, Max 999; an En die Konstante 1 und den Haken bei ‚En‘ entfernen. Nicht an <span class='sm-mono'>%s</span> mit 120 s – das meldet der Letzte Wille (NICHT, Einschaltverzögerung)."
S6 = "<b>Gegenprobe:</b> in Loxone steigt <span class='sm-mono'>%s</span> alle %d s um 1. Im Plugin zeigt der Reiter Test die Befehlsbrücke (status/befehle) und die letzte Quittung."
ALT_TITEL = "Bestehende Anlagen: der alte Weg (bis 1.3.23)"
ALT_TEXT = "Befehle auf &lt;Präfix&gt;/&lt;Gerät&gt;/cmd/… brauchen den Haken „Alten Befehlsweg annehmen“ (Reiter MQTT; nach einem Update an). Die Ausgangsvorlage heißt jetzt „Chromecast alt: &lt;Gerät&gt; &lt;Befehl&gt;“ – kein Ausgang heißt mehr wie ein Gateway-Eingang. Die Eingangsvorlage mit http://localhost gibt es nicht mehr."
ALT_ZAHL = "Für %d Gerät(e) (%s) und „alle“ je %d Ausgänge."

