DATEISYSTEM_HINWEIS = "<b>Am LoxBerry:</b> ext4 ist am besten (Rechte, Stabilität). exFAT ist gut, wenn die Platte auch am Windows-PC befüllt wird (Debian 13 kann exFAT im Kernel). NTFS geht (Kernel-Treiber ntfs3), aber nur als Notlösung: keine Linux-Rechte, und nach unsauberem Abziehen ist es womöglich nur noch lesbar. FAT32 nicht (Dateien höchstens 4 GB, Umlaute in Namen). <b>An der FRITZ!Box:</b> exFAT oder NTFS, im LoxBerry als Netzwerkfreigabe (SMB) einbinden. <b>Strom:</b> der Raspberry Pi 4 gibt über USB zusammen etwa 1,2 A ab - ein NVMe-Gehäuse braucht gegebenenfalls einen aktiven USB-Hub."
