L_EIN = "Sperre aus Loxone annehmen (ab Werk aus)"
HILFE = "Loxone hält damit Ansagen an, etwa bei Abwesend, Gäste oder Schlafen: über die Befehlsbrücke <span class='sm-mono'>publish %s/befehl/sperre 1</span> zum Sperren und 0 zum Aufheben (Haken „Befehle über MQTT annehmen“, Reiter MQTT), auf dem alten Befehlsweg server/cmd/sperre, oder als UDP-Befehl an dieses Plugin <span class='sm-mono'>server/SPERRE 1;</span>. Andere Plugins auf diesem LoxBerry nehmen <tt>aktion=sperre</tt> mit <tt>wert=1</tt> oder <tt>0</tt> und dem Sprechtoken. Gesperrt werden Ansagen aus Loxone und über die Sprachausgabe für andere Plugins übersprungen (dort 200 GRUND=GESPERRT); <tt>dringend=1</tt> geht durch. Musik, Lautstärke und alle übrigen Befehle gelten weiter. Ohne Haken wird kein Wert angenommen und keiner wirkt. Der letzte Wert bleibt erhalten; nach einem Update ist er weg, dann gilt offen, bis Loxone ihn neu setzt - der Reiter Test zeigt das an."
