SICH_SCHREIBFEHLER = "Die Einstellungen ließen sich nicht schreiben."
SICH_UEBERNOMMEN = "Einstellungen zurückgespielt: %d Werte übernommen."
SICH_WARNUNG = "<b>Die Datei enthält Ihre Zugangsdaten.</b> Ohne sie stünden nach dem Zurückspielen alle Felder richtig, und das Plugin käme trotzdem nicht an die Anlage. Behandeln Sie die Datei wie ein Passwort: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."
SICH_ZU_GROSS = "Die Datei ist größer als erlaubt — eine Sicherung dieses Plugins ist wenige Kilobyte groß."
S_ABO_NOETIG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an</b> — einzutragen unter <i>System-Einstellungen → MQTT Gateway → Abonnements</i>:"
S_LOGIK_EINLEITUNG = "So sieht die vollständige Logik auf der Programmierseite aus (jede Zeile = ein Baustein), am Beispiel <b>eines</b> Lautsprechers. <span class='sm-mono'>&lt;G&gt;</span> steht für seinen Namen. Alle Bausteine findet man in Loxone Config über die Baustein-Suche (F5):"
S_NAME_GENAU = "Der Name muss <b>genau</b> so lauten wie in der Google-Home-App. Im Reiter Test findet <i>Chromecasts im Netz suchen</i> die richtigen Schreibweisen. Aus dem Namen wird das MQTT-Thema gebildet — Umlaute und Leerzeichen werden dabei ersetzt."
S_SCHRITT1 = "<b>Schritt 1: Geräte eintragen</b><br><br> Im Reiter <i>Einstellungen</i>. Die genauen Namen liefert im Reiter <i>Test</i> die Schaltfläche <i>Chromecasts im Netz suchen</i>. <b>Der Name muss zeichengenau stimmen</b> — das Plugin findet das Gerät nur über seinen Anzeigenamen aus der Google-Home-App."
S_SCHRITT2 = "<b>Schritt 2: Abo im MQTT-Gateway eintragen</b><br><br> <b>Ohne diesen Eintrag kommt am Miniserver nichts an</b> — einzutragen unter <i>System-Einstellungen → MQTT Gateway → Abonnements</i>:"
S_SCHRITT2_KOPF = "<b>Schritt 2: Das Abo im MQTT-Gateway</b><br><br>"
S_SCHRITT3 = "<b>Schritt 3: Vorlagen herunterladen</b><br><br> Unten stehen zwei Dateien bereit — einmal die Eingänge, einmal die Ausgänge."
S_SCHRITT4 = "<b>Schritt 4: In Loxone Config einlesen</b><br><br> Rechtsklick auf den Miniserver → <i>Vorlage einfügen</i> → heruntergeladene Datei wählen. Das für beide Dateien. Die Eingangsvorlage legt nur die Namen an; die Werte liefert das Gateway. Unter <i>Incoming overview</i> erscheinen die Themen, sobald der Dienst läuft. <b>Von Hand angelegt</b> heißt ein Eingang"
S_SCHRITT5 = "<b>Schritt 5: Kachel und Bedienung in der App</b><br><br> Einen <i>Status</i>-Baustein anlegen, <span class='sm-mono'>v1</span> mit <span class='sm-mono'>title</span> und <span class='sm-mono'>v2</span> mit <span class='sm-mono'>volume</span> verbinden. Zum Bedienen genügen zwei Taster für lauter und leiser sowie einer für Pause — sie hängen an den virtuellen Ausgangsbefehlen aus der Ausgangsvorlage. Aufbau in Schritt&nbsp;6."
S_SCHRITTWEITE_GILT = "Gilt für <span class='sm-mono'>volume_up</span> und <span class='sm-mono'>volume_down</span>."
S_UDPPORT_FEHLT = "Der <b>UDP-Eingangsport</b> des MQTT-Gateways ist nicht auffindbar. Die Ausgangsvorlage trägt dann Port 0 ein. Im Gateway unter <i>UDP In</i> einen Port setzen und die Vorlage neu erzeugen."
S_ZU_6 = "der virtuelle Ausgang geht <b>nicht</b> an den LoxBerry, sondern an den UDP-Eingang des MQTT-Gateways. Das Gateway macht daraus eine MQTT-Nachricht, auf die dieses Plugin hört. Das ist der im LoxBerry-Wiki vorgesehene Weg und braucht keinen zusätzlichen Port.<br> <b>Zu #8 und #9:</b> ein virtueller Ausgangsbefehl feuert bei der Flanke 0→1, nicht dauerhaft. Ein Merker allein würde beim Ausschalten nichts auslösen — deshalb die zwei Flankenbausteine.<br> <b>Zu #13:</b> Chromecasts gehen von selbst in den Ruhezustand und melden sich dann als nicht erreichbar. Eine halbe Stunde Verzögerung verhindert Meldungen über einen Normalzustand.<br> <b>Zu #1 bis #5:</b> die Namen enthalten den Gerätenamen. <b>Wird das Gerät in der Google-Home-App umbenannt, ändern sich alle Themen</b> — dann hier den Namen nachziehen und die Vorlagen neu erzeugen."
S_ZU_9 = "→ Ausgangsbefehl <span class='sm-mono'>stop</span>"
