H_ODER = "Beide Störungen (Dienst meldet sich nicht, Zähler steht) laufen über ein ODER in eine Benachrichtigung."
H_KONSTANTE = "Die Analogwertvalidierung bekommt an En die Konstante 1."
H_EN_NEGIERT = "Zu #16: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
H_RUHE = "Ein Lautsprecher im Ruhezustand meldet „nicht erreichbar“ – das ist normal und löst keine Meldung aus. Gemeldet wird nur ein Ausfall des Dienstes (Nr. 18) und verlorene MQTT-Nachrichten (Nr. 40)."
H_ALLE = "„Alle …“-Befehle laufen auf jedem Lautsprecher einzeln und um Sekundenbruchteile versetzt. Für Musik auf mehreren Lautsprechern eine Google-Lautsprechergruppe anlegen und wie ein Gerät eintragen – nur sie spielt synchron."
H_RADIO = "Eine Radiotaste ein zweites Mal drücken wählt sie ab (0 = nichts passiert); erneut drücken startet den Favoriten wieder."
H_ANSAGE = "Eine Ansage unterbricht, was läuft, und setzt es danach fort (Plugin, Reiter „%s“, „%s“, ab Werk an)."
A_S1 = "Im Plugin, Reiter „%s“, die Lautsprecher eintragen, einer je Zeile, Name genau wie in der Google-Home-App (Reiter „%s“ → „%s“ liefert die Namen). Speichern."
A_S2 = "Reiter „%s“: Haken „Befehle über MQTT annehmen“ und „Lautsprecher über MQTT steuern“ setzen und speichern. Für die Werte tun, was oben in Schritt 1 für Ihre Fassung des MQTT-Gateways steht (V1: nichts, die Abo-Datei liegt bei; V2: die Datenpunkte anhaken). Ohne diesen Schritt kommt am Miniserver nichts an."
A_S3 = "Neue Seite „Chromecast4lox“. Die Werte Nr. 1–4, 20–24, 26, 27, 36 und 37 als Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Name genau wie in der Tabelle; „Als Digitaleingang“ nicht anhaken. Für einen anderen Lautsprecher als „Wohnzimmer“ oder ein anderes Präfix stehen die Namen in der Namenstabelle (Schritt 2)."
A_S4 = "Die Texteingänge Nr. 29–33 und 35 als Virtueller Texteingang anlegen, Titel genau wie in der Tabelle (der Knopf „%s“ in der Namenstabelle hilft). Bei Nr. 35 „In Visualisierung verwenden“ anhaken. Das Gateway füllt sie, sobald der Dienst läuft."
A_S5 = "Die Befehle Nr. 8, 9, 11, 13 und 44 als Virtuelle Ausgangsbefehle am Ausgang „LoxBerry MQTT-Gateway“ anlegen, Befehl wie in der Tabelle – oder in Schritt 3 „%s“ drücken und die Datei EINMAL einlesen (Baum links Virtuelle Ausgänge → Menüband Vordefinierte Geräte → Vorlage Importieren…); sie legt den Ausgang „Chromecast 4 Lox NG MQTT-Befehle“ mit allen Befehlen an."
A_S6 = "Virtuelle Eingänge für die App anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „In Visualisierung verwenden“ an): Schalter „Musik Wohnzimmer“ (Nr. 6); Tasten „Lauter“, „Leiser“, „Weiter spielen“, „Pause“ (Nr. 10, 12, 41, 43)."
A_S7 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Chromecast Meldung“ (Nr. 18) und „Chromecast MQTT-Verluste“ (Nr. 40), Text wie in der Tabelle, Empfänger wählen, auf die Seite ziehen."
A_S8 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, die Parameter eintragen und nach der Spalte „%s“ von oben nach unten verbinden. Ein ODER hat zwei Eingänge. Status: die Zeilen in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt; die Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein (Nr. 25 und 34)."
A_S9 = "Speichern und in den Miniserver übertragen. Probe: Schalter „Musik Wohnzimmer“ ein → „Wohnzimmer spielt“ zeigt App und Titel, „Pause“ hält an, „Weiter spielen“ setzt fort, Schalter aus beendet. Kommt nichts an: der Texteingang Nr. 35 und im Plugin der Reiter Test (Befehlsbrücke, letzte Quittung)."
B_S1 = "Werte und Befehle wie auf der Seite „Chromecast4lox“ – die Namen und Befehle stehen in den Schritten 2 und 3 oben."
B_S2 = "Im Plugin, Reiter „%s“, unter „%s“ bis zu acht Sender eintragen, je Zeile „Name = Adresse“. Zeile 1 = Taste 1 der Radiotasten usw.; eine Zeile mittendrin löschen verschiebt alle folgenden. Wer eine Lautstärke-Obergrenze oder Nachtruhe will, trägt sie dort unter „%s“ ein (z. B. 22:00 bis 07:00, höchstens 30)."
B_S3 = "Neue Seite „Chromecast4lox Steuerung“. Die Befehle der Tabelle (Nr. 2, 4, 6, 8, 10, 12, 14, 19, 21, 23, 25, 27, 29, 31, 33, 35, 37) als Virtuelle Ausgangsbefehle am Ausgang „LoxBerry MQTT-Gateway“ anlegen, Befehl wie in der Liste – oder aus dem Ausgang der Vorlage „%s“ auf die Seite ziehen. Die Ansage Nr. 35 hat einen festen Text und steht nicht in der Vorlage: von Hand anlegen."
B_S4 = "Ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden: die Befehle der Seite „Chromecast4lox“ (Wiedergabe, beenden, lauter, leiser, Pause) hier NICHT noch einmal."
B_S5 = "Virtuelle Eingänge anlegen („In Visualisierung verwenden“ an): 11 Tasten (Nr. 5, 7, 9, 13, 17, 20, 22, 24, 26, 32, 34), 3 Schalter (Nr. 3, 30, 36, Startwert aus), 2 Schieberegler (Nr. 1, 28: Min 0, Max 100, Schritt 5, Startwert 30)."
B_S6 = "Eigene Quellen: „Anwesenheit (eigene Quelle)“ (Nr. 15) aus der eigenen Anwesenheit speisen (z. B. Präsenz, Alarmanlage „unscharf“); steht der Eingang schon im Baum (Seite „Saugroboter“), ein weiteres Mal auf die Seite ziehen. Wird das Haus leer, gehen alle Lautsprecher aus. Türklingel: im eigenen Projekt die Leitung vom Klingeltaster (Digitaleingang, Intercom-Klingel) an Nr. 35 legen und die Taste Nr. 34 löschen."
B_S7 = "Radiotasten (Taste F5 → „Radiotasten“): Doppelklick, Tasten 1–8 wie die Favoriten benennen, Remanenz aus lassen. Ausgang AQ an Nr. 12."
B_S8 = "Flankenerkennung (Pd 1 s) und ODER setzen – ein ODER hat zwei Eingänge – und nach der Spalte „%s“ von oben nach unten verbinden. Speichern und übertragen."
B_S9 = "Probe: Taste „Türklingel (eigene Quelle)“ in der App → alle Lautsprecher sagen „Es hat geklingelt“, danach läuft die Musik weiter. Schalter „Ansagen sperren“ ein → die Klingel bleibt still, Musik und Tasten wirken weiter. Radiotaste 1 → Favorit 1 spielt auf „Wohnzimmer“; auf der Seite „Chromecast4lox“ zeigt „Lautsprecher Wohnzimmer“ „zuletzt Favorit Nr. 1“."
H_MUSIK = "„Musik Wohnzimmer“ ist ein Virtueller Eingang (Schalter) für die App; die Flankenerkennung schickt beim Einschalten über das ODER #42 den Befehl „Chromecast: Wohnzimmer Wiedergabe“, beim Ausschalten „Chromecast: Wohnzimmer beenden“. Die Taste „Weiter spielen“ (#41) geht über dasselbe ODER – der Befehl „Wiedergabe“ steht nur einmal im Projekt."
H_RUECKMELDUNG = "Der Texteingang Nr. 35 (chromecast4lox_Wohnzimmer_last_error) sagt, warum der letzte Befehl nicht geklappt hat; leer heißt: in Ordnung. Ob die Befehlsbrücke einen Befehl angenommen hat, steht im Plugin im Reiter Test (letzte Quittung)."
H_SPERRE = "„Ansagen sperren“ (Nr. 36/37) hält nur Ansagen an; Musik, Lautstärke und Tasten bleiben frei. Es wirkt mit dem Haken „Sperre aus Loxone annehmen“ (Plugin, Reiter Einstellungen). Bewusst ein eigener Schalter und nicht die Anwesenheit: ein Virtueller Eingang startet nach einem Neustart des Miniservers bei 0 und sperrte sonst alle Ansagen bis zur ersten Meldung."
H_OHNE_APP = "Befehle an einen Lautsprecher, auf dem keine App läuft (Pause, Weiter, Titelsprung), bleiben wirkungslos; der Grund steht im Texteingang chromecast4lox_Wohnzimmer_last_error (Seite „Chromecast4lox“, Nr. 35)."
H_REGLER = "Lautstärkeregler und Stumm-Schalter zeigen Ihre letzte Einstellung, nicht unbedingt den Lautsprecher (wurde in der Google-App verstellt, steht das Richtige auf der Seite „Chromecast4lox“). Gleiche Lautstärke binnen 60 s geht nur einmal hinaus; die Befehlsbrücke legt schnelle Reglerfolgen zusammen."

