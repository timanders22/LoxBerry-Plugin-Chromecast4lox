SICHTBAR_HINWEIS = "Übernehmen im Reiter Einstellungen über „Geräte im Netz suchen“."
H_GRENZEN = "Gut zu wissen"
LAUTSTAERKE = "<b>Lautstärke:</b> Das Plugin setzt die Lautstärke in ganzen Prozent (0-100) und schickt sie unverändert an den Lautsprecher. Die Protokollzeile von pychromecast zeigt dabei nur eine Nachkommastelle (für 25 Prozent steht dort „setting volume to 0.2“) - das ist nur die Schreibweise der Zeile, nicht der gesendete Wert. Am 30.10.2026 meldeten beide Google Home Speaker im Haus 45 Prozent, also keine Zehnerschritte. Nur „lauter“ und „leiser“ ohne Wert gehen in der Schrittweite aus dem Reiter Einstellungen."
GRENZEN = "Keine Musikoberfläche der Loxone App (Durchsuchen, Cover) - das ist Stufe 2. Synchron spielt nur eine Google-Gruppe; <tt>alle</tt> ist parallel. Eine Gruppe unterbricht, was ihre Mitglieder gerade spielen; mit „danach fortsetzen“ setzt der Dienst danach die Lautsprecher fort, die vorher spielten und durch die Gruppe verstummt sind. Die Klingel über Cast braucht etwa 1 s, wenn die Cast-App schon läuft, und etwa 2,5 s beim Kaltstart (App starten, puffern; gemessen am 30.10.2026 an einer Google-Gruppe). Loxone Radio ist nicht erreichbar (geschützte Schnittstelle); dieselben Sender als eigene Radioquellen eintragen. Die Standard-Sprachausgabe (Google-Übersetzer) ist inoffiziell, braucht Internet, und der Text geht an Google."
