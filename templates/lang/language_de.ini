T_ABLAGE_UNKLAR = "Medienablage: der Dienst hat noch nichts gemeldet."
T_ZAHLEN = "%d Zonen, %d Quellen."
W_ABLAGE = "<b>Öffentlich im Heimnetz:</b> Lautsprecher können sich nicht anmelden. Der Ordner ist deshalb ohne Anmeldung erreichbar, geschützt nur durch einen zufälligen Pfadschlüssel, den das Plugin beim Speichern würfelt (er wechselt mit dem Pfad). Freigegeben wird nur lesend und nur dieser eine Ordner. Liegt darin eine Datei, die der Webserver ausführen könnte (z. B. .php, .cgi, .sh), gibt der Dienst den Ordner nicht frei. Geprüft wird nach dem Dateinamen (auch Großschreibung und .cgi mitten im Namen), nicht nach Rechten - auf einer Netzfreigabe genauso; ein Verweis, der aus dem Ordner hinauszeigt, verhindert die Freigabe ebenfalls."
