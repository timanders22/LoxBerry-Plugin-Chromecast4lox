E_Z_GERAET_TEXT = "Wie in der Geräteliste (auch das MQTT-Thema, Groß/klein egal), mehrere durch Komma getrennt, <tt>gruppe:Name</tt> oder <tt>alle</tt>. Ein unbekannter Name gibt 404, nie einen Rückfall auf alle. Eingetragen sind: %s"
E_Z_ANTWORT = "Antwort"
E_Z_ANTWORT_TEXT = "Eine Zeile text/plain, etwa <tt>SPRECHEN;OK=1;GERAETE=2;UNVERAENDERT=0;OFFLINE=0;GRUND=EINGEREIHT</tt>. Als gesendet gilt nur HTTP 200 mit <tt>SPRECHEN;OK=1</tt>. OK=1 heißt: der laufende Dienst hat die Ansage bei den verbundenen Lautsprechern eingereiht - die Wiedergabe selbst wird nicht abgewartet."
E_Z_CODES = "Codes"
E_Z_CODES_TEXT = "200 eingereiht (OK=1) oder leerer Text (TEXT_NULL) · 400 Feld falsch · 403 Token, oder nicht von diesem LoxBerry · 404 Gerät unbekannt · 409 Sprachausgabe aus oder Sperre aus Loxone gesetzt (GESPERRT) · 429 Stundengrenze oder Doppelauslösung binnen 5 s (DOPPELT) · 503 Dienst läuft nicht oder antwortet nicht, kein Lautsprecher verbunden. Jede Antwort nennt GRUND."
E_Z_SELBSTTEST = "Selbsttest"
E_Z_SELBSTTEST_TEXT = "<tt>selftest=1</tt> mit <tt>token</tt>: <tt>SELFTEST;OK=1;TOKEN=OK;SPRECHEN=1;DIENST=1</tt> - prüft nur das Token, spricht nichts."
E_Z_STATUS = "Status"
E_Z_STATUS_TEXT = "<tt>?aktion=status</tt> ohne Token, lesend: <tt>CHROMECAST4LOX;OK=1;SPRECHEN=1;DIENST=1;ALTER=…</tt>"
E_Z_GRENZEN = "Grenzen"
E_Z_GRENZEN_TEXT = "Höchstens %d Ansagen je Stunde; derselbe Text an dasselbe Gerät innerhalb von 5 s gilt als Doppelauslösung (429 DOPPELT). Ruhezeit, Lautstärke-Obergrenze, Klang vorab und Fortsetzen gelten wie bei Ansagen aus Loxone."
E_ALEXA = "Unterschiede zu Alexa-NG: der Ordner in der Adresse und die Gerätenamen. Dazu: SSML gibt es nicht (400 SSML), <tt>dringend=1</tt> übergeht nur die Sperre aus Loxone (die Ruhezeit begrenzt hier nur die Lautstärke), und es gibt nur ein Token - auch für Lautstärke, Geräteliste und Sperre. Ausführlich: README, Abschnitt Sprachausgabe für andere Plugins."
E_KEINE = "(keine)"
G_GESPERRT = "Die Sperre aus Loxone ist gesetzt - die Ansage wurde übersprungen, nicht gesprochen (dringend=1 geht durch)."

