S_ZU_6 = "the virtual output goes <b>not</b> to the LoxBerry, but to the UDP input of the MQTT Gateway. The Gateway makes it an MQTT message, to which this plugin listens. This is the intended way in the LoxBerry Wiki and needs no additional port.<br> <b>On #8 and #9:</b> a virtual output command fires at the flank 0→1, not permanently. A memory alone would trigger nothing when switching off — hence the two flank components.<br> <b>Zu #13:</b> Chromecasts go into standby by themselves and then report as unreachable. Half an hour delay prevents messages about a normal state.<br> <b>On #1 to #5:</b> the names contain the device name. <b>If the device is renamed in the Google Home App, all topics change</b> — then adjust the name here and regenerate the templates."
