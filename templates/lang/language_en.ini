L_VON = "Quiet hours from"
L_BIS = "to"
L_RUHEMAX = "Upper limit during quiet hours"
FEHLER = "Quiet hours need times in the form 22:00 — the entry was not accepted."
HINWEIS = "<b>Without effect by default:</b> 100 means no limit, and without times there are no quiet hours. The limit applies to <span class='sm-mono'>volume</span>, <span class='sm-mono'>volume_step</span>, <span class='sm-mono'>volume_up</span> and to announcements — it guards against a transposed digit in Loxone. A window may span midnight: 22:00 to 07:00 is the normal case."

