F_QUELLE_FORM = "Source ‘%s’: expected ‘No = radio|liste|datei | name | address’ with No 1 to 99."
F_QUELLE_ADRESSE = "Source %d: radio needs an http(s) address; liste and datei a path in the media store (relative, without ..), datei also an http(s) address."
F_QUELLE_DOPPELT = "Source %d appears twice."
F_ABLAGE_FORM = "Media store: an absolute path without .. and without control characters."
F_ABLAGE_FEHLT = "Media store: the folder is not there (drive mounted? share connected?)."
F_ABLAGE_ORT = "Media store: only a folder below the LoxBerry storage (USB/network share), /media or /mnt - not the root itself."
F_SCHLUESSEL = "The media store path key is never in a backup - a file containing one does not come from this plugin."
F_GONG = "Chime: a file of the media store (relative, without ..) or an http(s) address."
F_GONG_OHNE_ABLAGE = "Chime: a file of the media store needs a media store."
T_WIRD_GEPRUEFT = "being checked … (the service has not reported the saved change yet; on a network share the check takes up to a minute - reload the page)"
T_WARNUNG = "Warning:"
