WAS_IST_DAS = "<b>Controls Google Cast devices from the Loxone Miniserver</b> – Chromecast, Google Home and Nest, TVs with Chromecast built-in; for the new Google Home Speaker Google's data sheet does not list Google Cast, this is not measured. A service on the LoxBerry keeps the connection to the devices in the home network, takes commands such as volume, playback or favourites over MQTT or as UDP commands from the Miniserver and reports the state – volume, playback, title, artist, duration – back over MQTT. On request it speaks announcements, also for other plugins such as Voice Control or the Departure Assistant, and Loxone can lock the announcements. The direction Google → Loxone belongs to the Matter bridge in Matter2Lox (help, section Google ↔ Loxone)."
