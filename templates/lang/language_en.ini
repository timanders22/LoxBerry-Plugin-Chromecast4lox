[LOX]

S0 = "MQTT is the path of the sample project for values <b>and</b> commands. The HTTP endpoint remains for other plugins (speech output, below)."
S1 = "<b>Values: the MQTT gateway.</b> The service sends directly to the broker; the gateway passes each value to the Virtual Input of the same name. You create these inputs in Loxone Config with exactly this title – the gateway assigns solely by name. What to do depends on its version:"
S1_V1 = "Gateway V1: there is nothing to enter – the subscription file comes with the plugin and carries <span class='sm-mono'>%s</span>. It also takes commands and acknowledgements along; no command title is named like an input, no loop arises. Whoever does not want that uses V2."
S1_V1_FEHLT = "Gateway V1: the subscription file does not carry <span class='sm-mono'>%s</span> yet – save once on the tab MQTT."
S1_V2 = "Gateway V2: under <i>Subscriptions</i> in the group <span class='sm-mono'>%s</span> tick these %d data points (15 more per further device):"
HAKEN_AUF = "Tick list: %d data points"
T_NONCACHED = "Noncached"
S1_NONCACHED = "“Noncached” only for server/online: it arrives every minute with the same value 1; after a restart of the Miniserver V2 otherwise only sends changes, and the failure message would show “service does not report” until the next change."
S1_RECONNECT = "After a restart of the Miniserver the gateway delivers the values again by itself (page “LoxBerry MQTT-Gateway” in the sample project: reconnect)."
S2 = "<b>Create inputs:</b> one virtual input per value (Periphery → Virtual inputs), title <b>exactly</b> as in this table – no template. Texts (state, title, artist, album, app, last message) as virtual text input. In brackets the command name of the device for step 3."
S2_KEINE_GERAETE = "No device entered yet – the table only shows the values of the service (tab Settings)."
T_GERAET = "Device (command name)"
T_ART = "Type"
T_DIENST = "Service"
ART_TEXT = "text input"
ART_ZAHL = "input"
KOPIEREN = "copy"
KOPIERT = "copied"
S2_DIGITAL = "Do not tick “Use as digital input” – yes/no values (online, playing, muted …) also arrive as number 0/1."
S2_TEXT = "Text inputs show the text as it arrives; “-” means no statement."
S2_FEHLWERT = "-1 means “unknown”: volume without reported volume, volume, duration and favorit of a device removed from the list; its yes/no values go to 0."
S2_RECHTE = "The LoxBerry user in the Miniserver needs rights on these inputs."
S2_UMBENENNEN = "Other prefix or other device name = all names new. Umlauts are rewritten: “Küche” → topic “Kueche” → input chromecast4lox_Kueche_volume, command name “kueche”."
S3 = "<b>Commands:</b> Loxone sends “publish &lt;topic&gt; &lt;value&gt;” to the UDP input of the MQTT gateway; the command bridge of this plugin listens on <span class='sm-mono'>%s</span>, checks every command and passes it on to the service – the same place as before (lock, upper limit, quiet time, same volume within 60 s)."
S3_HAKEN = "For the commands tick “Accept commands via MQTT” and – for everything audible – “Control speakers via MQTT” on the tab MQTT."
S3_KEINE = "The command list is not readable (bin/befehlsbruecke.php or bin/befehle_zuordnung.php missing or broken) – see tab Test."
S3_NICHTS = "For commands there is nothing to enter under gateway V1 and V2."
S3_ANSAGE = "Loxone sends an announcement with a fixed text (publish …/tts Es hat geklingelt) or from the status output TQ; empty or “0” is not spoken."
S3_SCHRITT = "louder and quieter are pulses: how much is set in the plugin (tab Settings, step) – the template need not be created again afterwards. play only resumes via MQTT; media are started via favourites."
S3_VORLAGE = "The template creates the virtual output “Chromecast 4 Lox NG MQTT-Befehle” (/dev/udp/%s/%d) – per device and “alle” the commands without announcement, plus “Ansagen sperren”. Import ONCE: tree on the left Virtual outputs → ribbon Predefined devices → Import template…."
S4 = "<b>Failure detection:</b> analog value validation on <span class='sm-mono'>%s</span> with Tmc %d s (three times the cycle, at least 180 s), Min 0, Max 999; constant 1 at En and remove the tick at ‚En‘. Not on <span class='sm-mono'>%s</span> with 120 s – that is reported by the last will (NOT, on-delay)."
S6 = "<b>Cross-check:</b> in Loxone <span class='sm-mono'>%s</span> rises by 1 every %d s. In the plugin the tab Test shows the command bridge (status/befehle) and the last acknowledgement."
ALT_TITEL = "Existing installations: the old path (up to 1.3.23)"
ALT_TEXT = "Commands on &lt;prefix&gt;/&lt;device&gt;/cmd/… need the tick “Accept old command path” (tab MQTT; on after an update). The output template is now named “Chromecast alt: &lt;device&gt; &lt;command&gt;” – no output is named like a gateway input any more. The input template with http://localhost no longer exists."
ALT_ZAHL = "For %d device(s) (%s) and “alle” %d outputs each."

[AUDIO]
EINLEITUNG = "<b>Audio (stage 1):</b> zones with a fixed number, one source list for radio buttons (radio stations, playlists, single files), a media store on a USB drive or network share, and a doorbell on many speakers. Operated from Loxone via MQTT (command bridge) - radio buttons, sliders, push buttons, status texts. The Music Server keeps running; nothing here switches it off."
H_ZONEN = "Zones"
L_ZONEN = "Zones (one per line: No = target or No = display name | target)"
H_ZONEN_FELD = "Number 1 to %d. The target is the name of a speaker or a Google speaker group from the device list (Settings tab): %s. Topics and commands use the number - renaming a device in Google Home does not break the Loxone wiring (the plugin remembers the device ID on first contact). A group must first be created in the Google Home app."
SP_NAME = "Display name"
SP_ZIEL = "Target"
SP_BEFEHL = "Commands"
SP_THEMA = "Values"
SP_ZUSTAND = "State"
ONLINE = "connected"
OFFLINE = "not connected"
QUELLE_N = "source %d"
GRUPPE = "group"
MITGLIEDER = "members: %s"
MITGLIEDER_KEINE = "no members reported"
MITGLIEDER_OFFEN = "members not reported yet"
MITGLIED_VON = "in group %s"
H_QUELLEN = "Sources (radio buttons)"
L_QUELLEN = "Sources (one per line: No = kind | name | address)"
H_QUELLEN_FELD = "Number 1 to %d, shared by all zones. Kind <tt>radio</tt>: stream address (http/https; .m3u and .pls are resolved, the content type comes from the response). Kind <tt>liste</tt>: folder or M3U file in the media store (folder = all audio files alphabetically, M3U = its order, at most 200 tracks); next/previous then work. Kind <tt>datei</tt>: a file of the store or an http address. Playable: <tt>.mp3</tt>, <tt>.m4a</tt>, <tt>.aac</tt>, <tt>.flac</tt>, <tt>.ogg</tt>/<tt>.oga</tt>/<tt>.opus</tt>, <tt>.wav</tt>, <tt>.webm</tt> and <tt>.mp4</tt> (for videos only the sound). In Loxone: radio buttons, output to <tt>zone_&lt;No&gt;/quelle</tt> (value = number, 0 = stop)."
H_AUS_FAVORITEN = "As long as the source list is empty, the favourites count as radio sources with their numbers - the field is pre-filled with them; saving takes them over."
H_ABLAGE = "Media store (SSD/NAS)"
L_ABLAGE = "Folder of the media store"
L_ABLAGE_WAHL = "Storage of the media store"
H_ABLAGE_WAHL = "You can choose what LoxBerry has mounted: USB drives and network shares (LoxBerry: <i>Network shares</i>, e.g. a FRITZ!Box - see below). Enter the folder inside under <i>Subfolder</i>, e.g. <tt>/Music</tt>. <i>Custom path</i> takes another folder below /media or /mnt; a previous path that matches no storage is shown there. Only <i>Save</i> takes over the choice. A newly added share appears once LoxBerry reaches it (reload the page)."
L_ABLAGE_ZIEL = "Will be saved as:"
H_ABLAGE_HAND = "Advanced: path by hand"
H_FRITZ = "Set up storage on a FRITZ!Box as a network share"
FRITZ_HINWEIS = "<b>On the FRITZ!Box</b> (http://fritz.box): <i>Home Network → USB / Storage → Storage (NAS)</i> - switch on “Storage (NAS) enabled”. Under <i>System → FRITZ!Box Users</i> create a user (or take an existing one) with the right “Access to NAS contents”; read access is enough. <b>On the LoxBerry:</b> <i>Network shares</i> → add a server: address <tt>192.168.178.1</tt> or <tt>fritz.box</tt>, type SMB, user name and password of this FRITZ!Box user. The share (usually <tt>FRITZ.NAS</tt>) then appears in the selection here; enter the music folder as subfolder, e.g. <tt>/Music</tt>. LoxBerry mounts the share itself when needed (and unmounts it after 5 minutes of idle time); the web server may read it. Only the chosen folder is shared, read-only - use a folder just for music, not the whole drive."
H_ABLAGE_FELD = "A folder LoxBerry mounts itself: USB drive (storage manager) or network share - below %s. Empty = no store. Files are served directly by the LoxBerry web server (seeking supported), no PHP in the data path."
L_ABLAGE_ZUSTAND = "State reported by the service:"
T_ABLAGE_OK = "released, %d audio files"
T_ABLAGE_NEIN = "not released: %s"
T_ABLAGE_ESTALE = "Network share hangs (stale file handle) – remount it on the LoxBerry; for a FRITZ!Box add the option noserverino in %s and then restart autofs"
T_ABLAGE_UNKLAR = "Media store: the service has not reported yet."
T_ZAHLEN = "%d zones, %d sources."
W_ABLAGE = "<b>Public on the home network:</b> speakers cannot log in. The folder is therefore reachable without login, protected only by a random path key the plugin rolls when saving (it changes with the path). Only this one folder is shared, read-only. If it contains a file the web server could execute (e.g. .php, .cgi, .sh), the service does not release it. The check goes by file name (upper case and .cgi inside a name included), not by permissions - the same on a network share; a link pointing out of the folder also prevents the release."
H_KLINGEL = "Doorbell"
L_KLINGEL_ZIEL = "Default doorbell target"
H_KLINGEL_ZIEL = "A Google speaker group (recommended, plays in sync), a speaker, or a zone as <tt>zone_&lt;No&gt;</tt>. Empty = the command <tt>klingel</tt> without target does nothing."
L_KLINGEL_RUECKFALL = "Fallback if the target does not answer"
H_KLINGEL_RUECKFALL = "Speakers separated by ; or <tt>alle</tt>; empty or <tt>alle</tt> = the members of the doorbell group once the group has reported them (State column of the zones), otherwise all entered speakers (no groups, no TVs - those only if named here). They play in parallel, not in sync."
P_RUECKFALL = "alle"
L_KLINGEL_GONG = "Chime"
H_KLINGEL_GONG = "A file of the media store (e.g. toene/gong.mp3) or an http(s) address. Empty = your own chime (below), otherwise the announcement chime, otherwise the standard chime. If the file is missing in the store (e.g. after switching the store), your own or the standard chime plays - the doorbell is never silent."
L_KLINGEL_PEGEL = "Doorbell volume (0-100)"
H_KLINGEL_PEGEL = "Empty = the current volume. During quiet hours their limit applies - the doorbell then plays more quietly rather than not at all. If you want nothing at night, set the lock from Loxone."
L_KLINGEL_TEXT = "Announcement after the chime (optional)"
P_KLINGEL_TEXT = "Someone is at the front door"
H_KLINGEL_TEXT = "Empty = chime only. With text, the configured speech output speaks afterwards (Settings tab). Trigger: <tt>%s/befehl/klingel</tt> (default target) or <tt>…/befehl/zone_&lt;No&gt;/klingel</tt>, each with 1; a second ring within 10 s is merged."
H_SPEICHERN = "Saves this section only. The service reads the change on its next cycle and sets up zones and store itself; no restart."
H_GESPEICHERT = "Audio saved. The service takes over zones, sources and store on its next cycle."
H_SICHTBAR = "Visible on the network but not entered"
