SICHTBAR_HINWEIS = "Take them over on the Settings tab via ‘Search devices on the network’."
H_GRENZEN = "Good to know"
LAUTSTAERKE = "<b>Volume:</b> the plugin sets the volume in whole percent (0-100) and sends it unchanged to the speaker. The pychromecast log line shows only one decimal (for 25 percent it reads ‘setting volume to 0.2’) - that is only how the line is written, not the value sent. On 30.10.2026 both Google Home Speakers in the house reported 45 percent, so no steps of ten. Only ‘louder’ and ‘quieter’ without a value use the step size from the Settings tab."
GRENZEN = "No music interface in the Loxone app (browsing, covers) - that is stage 2. Only a Google group plays in sync; <tt>alle</tt> is parallel. A group interrupts whatever its members are playing; with “resume” on, the service afterwards resumes the speakers that were playing and went silent because of the group. The doorbell via Cast takes about 1 s when the Cast app is already running and about 2.5 s from a cold start (start app, buffer; measured on 30.10.2026 with a Google group). Loxone Radio is not reachable (protected interface); enter the same stations as your own radio sources. The default speech output (Google Translate) is unofficial, needs internet, and the text goes to Google."
F_ZONE_FORM = "Zone ‘%s’: expected ‘No = target’ or ‘No = name | target’."
F_ZONE_NR = "Zone ‘%s’: number 1 to %d expected."
F_ZONE_ZIEL = "Zone %d: no valid target (empty or with semicolon)."
F_ZONE_DOPPELT = "Zone %d appears twice."
