SICH_WARNUNG = "<b>The file contains the action token of this installation</b> — the keyword with which the page rejects foreign forms. The speech token for other plugins is not in it. Treat the file as confidential: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
S_ABO_NOETIG = "<b>Without this entry nothing arrives at the Miniserver</b> — to enter under <i>System Settings → MQTT Gateway → Subscriptions</i>:"
S_LOGIK_EINLEITUNG = "This is what the complete logic looks like on the programming page (each line = one component), using the example <b>of a</b> Speaker. <span class='sm-mono'>&lt;G&gt;</span> stands for its name. All components can be found in Loxone Config via the component search (F5):"
S_NAME_GENAU = "The name must <b>exactly</b> match what is in the Google Home App. In the tab Test you will find <i>Search Chromecasts in network</i> the correct spellings. From the name the MQTT topic is formed — Umlauts and spaces are replaced."
S_SCHRITT1 = "<b>Step 1: Enter devices</b><br><br> On the tab <i>Settings</i>. The exact names are found by the button <i>Search for Chromecasts on the network</i> on the same tab. <b>The name must match character by character</b> — the plugin finds the device only via its display name from the Google Home App."
S_SCHRITT2 = "<b>Step 2: Enter subscription in MQTT Gateway</b><br><br> <b>Without this entry nothing arrives at the Miniserver</b> — to enter under <i>System Settings → MQTT Gateway → Subscriptions</i>:"
S_SCHRITT2_KOPF = "<b>Step 2: The subscription in the MQTT gateway</b><br><br>"
S_SCHRITT3 = "<b>Step 3: Download templates</b><br><br> Below two files are available — one for the inputs, one for the outputs."
S_SCHRITT4 = "<b>Step 4: Load into Loxone Config</b><br><br> Right click on the Miniserver → <i>Insert template</i> → select downloaded file. Do this for both files. The input template only creates the names; the values are provided by the gateway. Under <i>Incoming overview</i> the topics appear as soon as the service runs. <b>Created manually</b> an input is called"
S_SCHRITT5 = "<b>Step 5: Tile and operation in the App</b><br><br> Create a <i>Status</i> component and connect <span class='sm-mono'>v1</span> with <span class='sm-mono'>title</span> and <span class='sm-mono'>v2</span> with <span class='sm-mono'>volume</span>. To operate, two buttons for louder and quieter as well as one for pause are sufficient — they are attached to the virtual output commands from the output template. Setup in Step&nbsp;6."
S_SCHRITTWEITE_GILT = "Applies to <span class='sm-mono'>volume_up</span> and <span class='sm-mono'>volume_down</span>."
S_UDPPORT_FEHLT = "The <b>UDP input port</b> of the MQTT gateway cannot be found. The output template then enters port 0. In the gateway under <i>UDP In</i> set a port and regenerate the template."
S_ZU_6 = "<b>On #8, #9, #11 and #13:</b> the commands come from the output template “Chromecast 4 Lox” (above, MQTT: <i>template: outputs</i>). Its address is the UDP input of the MQTT Gateway; the Gateway turns them into MQTT messages this plugin listens to. Without an MQTT Gateway the same route works via the template “Chromecast 4 Lox UDP” directly to the UDP port of this plugin; the commands are called <span class='sm-mono'>&lt;G&gt;_play</span> and so on there.<br> <b>On #3, #4 and #14 to #16:</b> what is watched is the <b>service</b>, not the speaker. <span class='sm-mono'>server/online</span> arrives retained with a last will: if the service dies or its connection breaks, the broker sets 0. <span class='sm-mono'>server/zaehler</span> counts up by one in every cycle; if it stops, the service no longer works, even if online still shows 1. A speaker goes into standby by itself and then reports as unreachable — that is a normal state, not a failure.<br> <b>On #16:</b> The analog value validation sets its output error when no new value arrives within Tmc; when the service stops it sends -1, which is below Min 0. Loxone Config labels the connectors V, En, Tmc, Min, Max and the output E (in the project file inval, mintime, minval, maxval, error). Connect the counter #4 to V, not to En; connect the constant 1 (#5) to En – unconnected, En shows off and the block does not validate. Output E goes through the OR (#17) to the notification.<br> <b>On #1, #2, #8, #9, #11 and #13:</b> the names contain the device name. <b>If the device is renamed in the Google Home App, all topics change</b> — then adjust the name here and regenerate the templates."
