SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin including the action token and the speech token and can be restored there. The speech tokens of other plugins that this plugin has taken over for its announcements are not in it; when restoring, the current ones stay."
