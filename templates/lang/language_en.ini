SICH_SCHREIBFEHLER = "The settings could not be written."
SICH_WARNUNG = "<b>The file contains the action token of this installation</b> — the keyword with which the page rejects foreign forms — <b>and the speech token</b> with which other plugins speak here. Treat the file as confidential: do not post it in a forum and do not attach it to a bug report."
S_ABO_NOETIG = "<b>Without this entry nothing arrives at the Miniserver</b> — to enter under <i>System Settings → MQTT Gateway → Subscriptions</i>:"
S_LOGIK_EINLEITUNG = "Two pages from the LoxBerry plugins sample project, each line one component, using the example of the speaker <b>“Wohnzimmer”</b> with the prefix <span class='sm-mono'>chromecast4lox</span> – that is how the components are named in the sample project. For your speakers and your prefix the names are in step&nbsp;2, the commands in step&nbsp;3. The first page shows playback, speaker and service and reports faults – it is enough to start with. The second puts volume, favourites, commands to all speakers, a doorbell announcement and the announcement lock into the app. Each page has its own numbers. All components can be found in Loxone Config via the component search (F5)."
S_NAME_GENAU = "The name must <b>exactly</b> match what is in the Google Home App. In the tab Test you will find <i>Search Chromecasts in network</i> the correct spellings. From the name the MQTT topic is formed — Umlauts and spaces are replaced."
S_SCHRITTWEITE_GILT = "Applies to <span class='sm-mono'>volume_up</span> and <span class='sm-mono'>volume_down</span>."
S_UDPPORT_FEHLT = "The <b>UDP input port</b> of the MQTT gateway cannot be found. The output template then enters port 0. In the gateway under <i>UDP In</i> set a port and regenerate the template."
S_ZU_6 = "<b>On #8, #9, #11, #13 and #44 (and the commands of the second page):</b> the commands are at the common output “LoxBerry MQTT-Gateway” of the sample project (address: UDP input of the MQTT gateway); the gateway turns them into MQTT messages, the command bridge of this plugin checks them and passes them on to the service. Every command needs the tick “Accept commands via MQTT”, everything audible also “Control speakers via MQTT” (tab MQTT).<br> <b>On #3, #4 and #14 to #16:</b> what is watched is the <b>service</b>, not the speaker. <span class='sm-mono'>server/online</span> arrives retained with a last will: if the service dies or its connection breaks, the broker sets 0. <span class='sm-mono'>server/zaehler</span> counts up by one in every cycle; if it stops, the service no longer works, even if online still shows 1. A speaker goes into standby by itself and then reports as unreachable — that is a normal state, not a failure.<br> <b>On #16:</b> The analog value validation sets its output error when no new value arrives within Tmc; when the service stops it sends -1, which is below Min 0. Loxone Config labels the connectors V, En, Tmc, Min, Max and the output E (in the project file inval, mintime, minval, maxval, error). Connect the counter #4 to V, not to En; connect the constant 1 (#5) to En (unconnected, En is ON). Output E goes through the OR (#17) to the notification.<br> <b>On all names with Wohnzimmer:</b> the names contain the device name. <b>If the device is renamed in the Google Home App, all topics change</b> — then adjust the name here and rename the virtual inputs according to the name table; the command name changes with it."
