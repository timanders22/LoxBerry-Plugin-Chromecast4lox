[SCHNELL]
; B2/B3 - ab Werk aus, siehe Hinweis.
H = "Report faster"
L = "Report on events and keep listening on the network (not tried on a device)"
HINWEIS = "Without this tick the plugin reads the state at the configured polling interval — the Miniserver then sees a pause up to ten seconds late. With it, pychromecast reports every change at once, and device discovery runs continuously instead of starting over each cycle. <b>Off by default:</b> this has not been tried on real hardware yet. The polling cycle remains in both cases — if the fast route fails it is logged and things carry on as before."

[FAV]
; B6 - Favoritenliste.
H = "Favourites"
L = "One favourite per line, as <span class='sm-mono'>Name = address</span>"
P = "Radio 1 = http://stream.example/radio1.mp3"
HINWEIS = "From Loxone the supplied output template cannot start a medium: <span class='sm-mono'>play</span> only resumes. A favourite is started with a <b>number</b> instead — the output command <span class='sm-mono'>play_favorit</span> is analogue, a button with the value 2 starts the second entry. The number is the line number: deleting a line in the middle shifts all following ones. The value 0 does nothing — otherwise a restart of the Miniserver would start the first entry. A playlist file (.m3u, .pls) is not understood by a Chromecast; put the stream address itself here."
SP_NR = "No."
SP_ADRESSE = "Address"

[RUHE]
