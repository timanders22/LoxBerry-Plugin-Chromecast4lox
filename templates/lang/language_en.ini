UE_WERTE = "Values, messages and playback"
UE_STEUERUNG = "Control, announcement and automatic"
SO_TITEL = "How to take over this page"
H_TITEL = "Notes"
H_ODER = "Both faults (service does not report, counter stands still) go through an OR into one notification."
H_KONSTANTE = "The analog value validation gets the constant 1 at En."
H_EN_NEGIERT = "On #16: Config creates input En inverted (tick at ‚En‘ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
H_RUHE = "A speaker in standby reports “unreachable” – that is normal and triggers no message. Only a failure of the service (no. 18) and lost MQTT messages (no. 40) are reported."
H_ALLE = "“Alle …” commands run on each speaker separately and a fraction of a second apart. For music on several speakers create a Google speaker group and enter it like a device – only it plays in sync."
H_RADIO = "Pressing a radio button a second time deselects it (0 = nothing happens); pressing it again starts the favourite again."
H_ANSAGE = "An announcement interrupts what is playing and resumes it afterwards (plugin, tab “%s”, “%s”, on by default)."
A_S1 = "In the plugin, tab “%s”, enter the speakers, one per line, name exactly as in the Google Home app (tab “%s” → “%s” provides the names). Save."
A_S2 = "Tab “%s”: tick “Accept commands via MQTT” and “Control speakers via MQTT” and save. For the values, do what step 1 above says for your version of the MQTT gateway (V1: nothing, the subscription file comes with the plugin; V2: tick the data points). Without this step nothing arrives at the Miniserver."
A_S3 = "New page “Chromecast4lox”. Create the values no. 1–4, 20–24, 26, 27, 36 and 37 as virtual inputs (Periphery → Virtual inputs → Virtual input), name exactly as in the table; do not tick “Use as digital input”. For a speaker other than “Wohnzimmer” or another prefix the names are in the name table (step 2)."
A_S4 = "Create the text inputs no. 29–33 and 35 as virtual text input, title exactly as in the table (the button “%s” in the name table helps). For no. 35 tick “Use in visualization”. The gateway fills them as soon as the service runs."
A_S5 = "Create the commands no. 8, 9, 11, 13 and 44 as virtual output commands at the output “LoxBerry MQTT-Gateway”, command as in the table – or press “%s” in step 3 and import the file ONCE (tree on the left Virtual outputs → ribbon Predefined devices → Import template…); it creates the output “Chromecast 4 Lox NG MQTT-Befehle” with all commands."
A_S6 = "Create virtual inputs for the app (Periphery → Virtual inputs → Virtual input, “Use in visualization” on): switch “Musik Wohnzimmer” (no. 6); buttons “Lauter”, “Leiser”, “Weiter spielen”, “Pause” (no. 10, 12, 41, 43)."
A_S7 = "Create two notifications (Periphery → Messages → Notification): “Chromecast Meldung” (no. 18) and “Chromecast MQTT-Verluste” (no. 40), text as in the table, choose recipients, drag onto the page."
A_S8 = "Place the remaining components via the component search (key F5), enter the parameters and connect them from top to bottom according to the column “%s”. An OR has two inputs. Status: the rows in the given order, the row without condition last; status inputs from V5 appear only after clicking the “+” on the component (no. 25 and 34)."
A_S9 = "Save and transfer to the Miniserver. Test: switch “Musik Wohnzimmer” on → “Wohnzimmer spielt” shows app and title, “Pause” pauses, “Weiter spielen” resumes, switch off stops. If nothing arrives: the text input no. 35 and in the plugin the tab Test (command bridge, last acknowledgement)."
B_S1 = "Values and commands as on the page “Chromecast4lox” – names and commands are in steps 2 and 3 above."
B_S2 = "In the plugin, tab “%s”, under “%s” enter up to eight stations, one per line “name = address”. Line 1 = button 1 of the radio buttons and so on; deleting a line in the middle shifts all following ones. Whoever wants an upper volume limit or night rest enters it there under “%s” (e.g. 22:00 to 07:00, at most 30)."
B_S3 = "New page “Chromecast4lox Steuerung”. Create the commands of the table (no. 2, 4, 6, 8, 10, 12, 14, 19, 21, 23, 25, 27, 29, 31, 33, 35, 37) as virtual output commands at the output “LoxBerry MQTT-Gateway”, command as in the list – or drag them from the output of the template “%s” onto the page. The announcement no. 35 has a fixed text and is not in the template: create it by hand."
B_S4 = "An output command may be inserted only once in Loxone: do NOT insert the commands of the page “Chromecast4lox” (Wiedergabe, beenden, lauter, leiser, Pause) here again."
B_S5 = "Create virtual inputs (“Use in visualization” on): 11 buttons (no. 5, 7, 9, 13, 17, 20, 22, 24, 26, 32, 34), 3 switches (no. 3, 30, 36, start value off), 2 sliders (no. 1, 28: Min 0, Max 100, step 5, start value 30)."
B_S6 = "Own sources: feed “Anwesenheit (eigene Quelle)” (no. 15) from your own presence (e.g. presence detector, alarm system “disarmed”); if the input is already in the tree (page “Saugroboter”), drag it onto the page once more. When the house becomes empty, all speakers stop. Doorbell: in your own project connect the doorbell button (digital input, intercom bell) to no. 35 and delete button no. 34."
B_S7 = "Radio buttons (key F5 → “Radio buttons”): double-click, name buttons 1–8 like the favourites, leave remanence off. Output AQ to no. 12."
B_S8 = "Place edge detection (Pd 1 s) and OR – an OR has two inputs – and connect them from top to bottom according to the column “%s”. Save and transfer."
B_S9 = "Test: button “Türklingel (eigene Quelle)” in the app → all speakers say “Es hat geklingelt”, then the music continues. Switch “Ansagen sperren” on → the doorbell stays silent, music and buttons keep working. Radio button 1 → favourite 1 plays on “Wohnzimmer”; on the page “Chromecast4lox” “Lautsprecher Wohnzimmer” shows “zuletzt Favorit Nr. 1”."
H_MUSIK = "“Musik Wohnzimmer” is a virtual input (switch) for the app; the edge detection sends the command “Chromecast: Wohnzimmer Wiedergabe” through the OR #42 when switched on and “Chromecast: Wohnzimmer beenden” when switched off. The button “Weiter spielen” (#41) goes through the same OR – the command “Wiedergabe” exists only once in the project."
H_RUECKMELDUNG = "The text input no. 35 (chromecast4lox_Wohnzimmer_last_error) says why the last command did not work; empty means OK. Whether the command bridge accepted a command is shown in the plugin on the tab Test (last acknowledgement)."
H_SPERRE = "“Ansagen sperren” (no. 36/37) only holds announcements; music, volume and buttons stay free. It works with the tick “Accept the lock from Loxone” (plugin, tab Settings). Deliberately a switch of its own and not the presence: a virtual input starts at 0 after a restart of the Miniserver and would otherwise lock all announcements until the first report."
H_OHNE_APP = "Commands to a speaker on which no app is running (pause, resume, track skip) have no effect; the reason is in the text input chromecast4lox_Wohnzimmer_last_error (page “Chromecast4lox”, no. 35)."
H_REGLER = "Volume slider and mute switch show your last setting, not necessarily the speaker (if it was changed in the Google app, the correct value is on the page “Chromecast4lox”). The same volume within 60 s is sent only once; the command bridge merges fast slider sequences."

