H_MODUS = "<b>Chromecast</b> is the normal case: the plugin builds an audio URL and plays it on the device. The other paths speak through a different device and are character for character those of the Abfahrtsassistent. The Google Translate path is unofficial (no guaranteed interface), needs internet, and the announcement text goes to Google; <b>Local</b> (espeak-ng) is the fallback without internet."
