[TTS]
H_ANSAGE = "Announcement (text-to-speech)"
EINLEITUNG = "A Chromecast can serve as a doorbell, alarm or warning device. The <span class='sm-mono'>tts</span> command takes the text and speaks it. The fields are named exactly as in the <b>Abfahrtsassistent</b> plugin and behave the same — if you have set up an announcement there, enter the same values here."
L_MODUS = "Output path"
H_MODUS = "<b>Chromecast</b> is the normal case: the plugin builds an audio URL and plays it on the device. The other paths speak through a different device and are character for character those of the Abfahrtsassistent."
; ACHTUNG - die folgenden fuenf Schluessel werden ZUR LAUFZEIT ausgewaehlt.
;
; cc_tts_modi() in cc_lib.php liefert die Schluesselnamen, und index.php ruft
; sie mit cc_t($cc_mt) auf. Eine Suche nach dem wortwoertlichen
; cc_t('TTS.M_CHROMECAST') findet sie deshalb NICHT - sie sehen dabei wie
; verwaiste Schluessel aus und sind es nicht. Wer sie loescht, bekommt im
; Auswahlkasten fuer die Ansageart die Schluesselnamen statt der Texte.
M_LOKAL = "Generated locally (espeak-ng, without Google) (not tried on a device)"
L_GONG = "Sound before the announcement"
H_GONG = "Address of a short audio file played before every announcement. Empty = none. Someone addressed without warning either misses it or is startled."
L_BASIS = "Base address for local announcements"
H_BASIS = "Only for local announcements: the speaker fetches the generated file from this address. Empty = the plugin works it out itself."
M_CHROMECAST = "Chromecast itself (Google Translate)"
M_MUSICSERVER = "Loxone Music Server (classic)"
M_MS4H = "Audioserver4Home / MusicServer4Home"
M_AUDIOSERVER = "Original Loxone Audioserver (via Loxone Config)"
M_CUSTOM = "Custom URL template"
L_SPRACHE = "Language"
H_SPRACHE = "Two-letter code, e.g. <span class='sm-mono'>de</span> or <span class='sm-mono'>en</span>."
L_PEGEL = "Announcement volume (%)"
P_PEGEL = "empty = keep"
H_PEGEL = "For the duration of the announcement only. Leaving it empty means the current volume stays as it is."
L_FORTSETZEN = "Resume what was playing after the announcement"
H_FORTSETZEN = "URL, position and volume are remembered — and only when there is something to remember. If Spotify or YouTube is running there is no URL that could be restored; then only the volume is restored and nothing is claimed."
L_IP = "IP of the speech service"
L_PORT = "Port"
L_ZONEN = "Zones"
L_LAUTSTAERKE = "Volume (%)"
L_VORLAGE = "URL template"
H_VORLAGE = "Placeholders: <span class='sm-mono'>{ip} {port} {zones} {vol} {lang} {text}</span>. Empty = MusicServer4Home default. A custom URL without <span class='sm-mono'>{ip}</span> needs no IP — that lets you address a local speech engine (Piper, opentts) and be independent of Google."
H_AUDIOSERVER = "The original Loxone Audioserver has <b>no</b> HTTP interface for announcements. In this mode the plugin does not speak itself; you build the announcement in Loxone Config using the text generator on the TTS input."
H_GRUPPEN = "Speaker groups"
L_GRUPPEN = "Include Google speaker groups in discovery"
H_GRUPPEN_TEXT = "A group announces itself on the network like a device of its own. Just add its name to the device list above. The gain: a group plays <b>in sync</b> across all its speakers — individual commands could not reproduce that, they would drift apart by fractions of a second."

