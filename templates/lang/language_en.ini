E_H = "Speech output for other plugins"
E_TEXT = "Other plugins on this LoxBerry let Google speakers speak (Google Home, Nest; for the Google Home Speaker Google Cast is not measured) - through <b>the same interface as Alexa-NG</b>. Whoever already addresses Alexa-NG only changes the folder in the address, the device names and the token."
E_AN = "Speech output is <b>on</b>."
E_AUS = "Speech output is <b>off</b> (default). Switch it on and set the speech token in the <i>Settings</i> tab, section Speech output for other plugins."
E_SP_WAS = "What"
E_SP_WERT = "Value"
E_Z_ADRESSE = "Address"
E_Z_ADRESSE_TEXT = "- by <b>POST</b>, only from this LoxBerry (127.0.0.1). A plugin reads the port from general.json (Webserver, Port)."
E_Z_FELDER = "Fields"
E_Z_FELDER_TEXT = "<tt>aktion=sprechen</tt>, <tt>token</tt> (speech token), <tt>text</tt> (1 to 1000 characters, without control characters and without angle brackets), <tt>geraet</tt> (empty = default device), <tt>laut</tt> (0 to 100, for this announcement only; empty = as set), <tt>dringend=1</tt> (overrides the lock from Loxone). The token belongs in the body of the request, never in the address. With the same token: <tt>aktion=lautstaerke</tt> with <tt>geraet</tt> and <tt>wert</tt> (0 to 100), <tt>aktion=geraete</tt> (one line per device, without addresses) and <tt>aktion=sperre</tt> with <tt>wert</tt> 1 or 0 (only with the tick Lock from Loxone) - details in the README."
E_Z_GERAET = "Device names"
E_Z_GERAET_TEXT = "As in the device list (also the MQTT topic, case does not matter), several separated by commas, <tt>gruppe:Name</tt> or <tt>alle</tt>. An unknown name gives 404, never a fallback to all. Entered are: %s"
E_Z_ANTWORT = "Answer"
E_Z_ANTWORT_TEXT = "One line text/plain, such as <tt>SPRECHEN;OK=1;GERAETE=2;UNVERAENDERT=0;OFFLINE=0;GRUND=EINGEREIHT</tt>. Only HTTP 200 with <tt>SPRECHEN;OK=1</tt> counts as sent. OK=1 means: the running service has queued the announcement for the connected speakers - playback itself is not awaited."
E_Z_CODES = "Codes"
E_Z_CODES_TEXT = "200 queued (OK=1) or empty text (TEXT_NULL) · 400 field wrong · 403 token, or not from this LoxBerry · 404 device unknown · 409 speech output off or lock from Loxone set (GESPERRT) · 429 hourly limit or double trigger within 5 s (DOPPELT) · 503 service not running or not answering, no speaker connected. Every answer names GRUND."
E_Z_SELBSTTEST = "Self-test"
E_Z_SELBSTTEST_TEXT = "<tt>selftest=1</tt> with <tt>token</tt>: <tt>SELFTEST;OK=1;TOKEN=OK;SPRECHEN=1;DIENST=1</tt> - checks the token only, says nothing."
E_Z_STATUS = "Status"
E_Z_STATUS_TEXT = "<tt>?aktion=status</tt> without token, read-only: <tt>CHROMECAST4LOX;OK=1;SPRECHEN=1;DIENST=1;ALTER=…</tt>"
E_Z_GRENZEN = "Limits"
E_Z_GRENZEN_TEXT = "At most %d announcements per hour; the same text to the same device within 5 s counts as a double trigger (429 DOPPELT). Quiet hours, volume limit, chime and resume apply as for announcements from Loxone."
E_ALEXA = "Differences to Alexa-NG: the folder in the address and the device names. In addition: there is no SSML (400 SSML), <tt>dringend=1</tt> only overrides the lock from Loxone (quiet hours only limit the volume here), and there is only one token - also for volume, device list and lock. In detail: README, section Sprachausgabe für andere Plugins."
E_KEINE = "(none)"
G_GESPERRT = "The lock from Loxone is set - the announcement was skipped, not spoken (dringend=1 gets through)."

[SPERRE]

H = "Lock from Loxone"
L_EIN = "Accept the lock from Loxone (off by default)"
HILFE = "With it Loxone holds announcements, for example when away, with guests or at night: through the command bridge <span class='sm-mono'>publish %s/befehl/sperre 1</span> to lock and 0 to unlock (tick “Accept commands via MQTT”, tab MQTT), on the old command path server/cmd/sperre, or as a UDP command to this plugin <span class='sm-mono'>server/SPERRE 1;</span>. Other plugins on this LoxBerry use <tt>aktion=sperre</tt> with <tt>wert=1</tt> or <tt>0</tt> and the speech token. While locked, announcements from Loxone and through the speech output for other plugins are skipped (there 200 GRUND=GESPERRT); <tt>dringend=1</tt> gets through. Music, volume and all other commands keep working. Without the tick no value is accepted and none takes effect. The last value is kept; after an update it is gone, then open applies until Loxone sets it again - the Test tab shows this."
JETZT = "State now: %s"
F_PRUEF = "Lock from Loxone"
A_AUS = "Switched off (default; Settings tab) - announcements are never locked."
A_UNBEKANNT = "No value set (after installation or an update) - counts as open until Loxone sets the lock."
A_GESPERRT = "Locked since %s (by %s) - announcements are skipped, dringend=1 gets through."
A_OFFEN = "Open since %s (by %s)."
MQTT_HINWEIS = "Lock through the command bridge: <span class='sm-mono'>%s/befehl/sperre</span> with 1 (lock announcements) or 0 (unlock) - only with the tick Accept the lock from Loxone in the Settings tab; send it without retain like every command. There is no state topic for it: Loxone knows the value it has set."

