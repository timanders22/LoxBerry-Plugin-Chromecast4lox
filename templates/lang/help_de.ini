; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Chromecast 4 Lox NG"
K02 = "Steuert Google-Cast-Geräte vom Loxone Miniserver aus – Chromecast, Google Home und Nest; beim Google Home Speaker ist Google Cast nicht gemessen – und meldet ihren Zustand zurück: Lautstärke, Wiedergabe, Titel, Interpret und mehr. Der Weg zum Miniserver ist MQTT."
K03 = "In vier Schritten eingerichtet"
K04 = "Reiter <i>Test</i> → <i>Chromecasts im Netz suchen</i>. Das liefert die Namen, wie sie das Gerät selbst meldet."
K05 = "Reiter <i>Einstellungen</i>: die Namen eintragen, einer je Zeile, und speichern. Der Dienst startet dabei neu."
K06 = "Reiter <i>Einbindung in Loxone</i>: beide Vorlagen herunterladen."
K07 = "In Loxone Config: Rechtsklick auf den Miniserver → <i>Vorlage einfügen</i> — einmal je Datei."
K08 = "Der Name muss stimmen"
K09 = "Das Plugin sucht das Gerät über seinen <b>Anzeigenamen</b>, so wie er in der Google-Home-App steht. Ein Tippfehler oder ein später umbenanntes Gerät führt dazu, dass gar nichts passiert — im Protokoll steht dann <tt>Chromecast '…' nicht gefunden</tt>. Nach einer Umbenennung muss der Name hier nachgezogen und die Loxone-Vorlage neu erzeugt werden, weil sich damit auch das MQTT-Thema ändert."
K10 = "Suche findet nichts"
K11 = "Chromecasts melden sich per mDNS im lokalen Netz. Das geht <b>nicht</b> über Netz- oder VLAN-Grenzen. Liegt der LoxBerry in einem anderen Segment als die Lautsprecher, findet die Suche nichts — daran ändert auch eine Firewall-Freigabe für einzelne Ports nichts. Weitere Ursachen: Gerät stromlos, gerade neu gestartet, oder UDP 5353 blockiert."
K12 = "Wiedergabe starten"
K13 = "Der Befehl <tt>play</tt> erwartet als Nutzlast die <b>direkte URL</b> eines Mediums, etwa einen MP3-Stream eines Radiosenders. Eine Playlist-Datei (<tt>.m3u</tt>, <tt>.pls</tt>) versteht der Chromecast nicht — dort muss die darin enthaltene Stream-Adresse eingetragen werden. Ohne Nutzlast setzt <tt>play</tt> eine pausierte Wiedergabe fort."
K14 = "MQTT oder UDP"
K15 = "<b>MQTT ist der empfohlene Weg.</b> Retained, also nach einem Neustart des Miniservers sofort wieder da, kommen <tt>state</tt>, <tt>playing</tt>, <tt>volume</tt>, <tt>muted</tt>, <tt>duration</tt>, <tt>type</tt>, <tt>group</tt>, <tt>favorit</tt> und <tt>tts_active</tt> sowie <tt>server/online</tt> und <tt>server/fassung</tt>. Flüchtig gehen <tt>online</tt>, <tt>app</tt>, <tt>title</tt>, <tt>artist</tt>, <tt>album</tt>, <tt>position</tt> und <tt>last_error</tt> hinaus, ebenso das Lebenszeichen <tt>server/ts</tt>, <tt>server/zaehler</tt>, <tt>server/geraete</tt> und <tt>server/verluste</tt>. Ob der Dienst lebt, sagen <tt>server/online</tt> (Letzter Wille) und <tt>server/zaehler</tt> — nicht das <tt>online</tt> eines Lautsprechers. Befehle schickt der Miniserver an den UDP-Eingang des MQTT-Gateways, das Gateway macht daraus MQTT; ein retained gesendeter Befehl wird verworfen, nicht ausgeführt, und beim Verbinden am Broker gelöscht und nachgelesen; was nach drei Versuchen noch steht, nennt der Reiter <i>Test</i>. Über MQTT braucht jeder Befehl einen Wert (z. B. 1); eine leere Nachricht wird nie ausgeführt. Eine absolute Lautstärke (<tt>volume</tt>), die mit demselben wirksamen Wert vor weniger als 60 s schon gesetzt wurde, wird nicht erneut gesendet (Protokoll: <tt>UNVERAENDERT=1</tt>); Schritte, lauter/leiser, <tt>mute</tt> und Tasten gehen immer hinaus."
K16 = "Der <b>UDP-Weg</b> ist der Weg der Originalfassung und bleibt erhalten. Er nimmt Textbefehle direkt entgegen und braucht kein Gateway — aber nur von den Miniservern aus den LoxBerry-Einstellungen und von diesem LoxBerry selbst; alles andere wird verworfen und im Protokoll vermerkt."
K17 = "Was sich gegenüber 0.2.31 geändert hat"
K18 = "Der Dienst läuft unter <b>Python 3</b>. Die alte Fassung war Python 2 und startete auf LoxBerry 4 gar nicht mehr."
K19 = "Gesteuert wird über <b>pychromecast</b> statt der mitgelieferten Go-Binärdatei. Von der gab es keine arm64-Fassung."
K20 = "<b>Mehrere Geräte</b> statt genau einem."
K21 = "Der Dienst läuft als Benutzer <tt>loxberry</tt>, nicht mehr als <tt>root</tt>."
K22 = "Herkunft und Lizenz"
K23 = "Grundlage ist das Plugin <b>Chromecast 4 Lox</b> von <b>Aleš Berka (Aleq)</b>, Fassung 0.2.31, unter der Apache-Lizenz 2.0 (<a href='http://aleq.eu/chromecast4lox/' target='_blank'>aleq.eu/chromecast4lox</a>). Das Original wird seit 2022 nicht mehr betreut."
K24 = "Diese Fortführung heißt seit 1.2.1 <b>Chromecast 4 Lox NG</b> und hat eine eigene Kennung, damit LoxBerry sie von der Originalfassung unterscheiden kann und Fehlerberichte nicht beim Originalautor landen. Das MQTT-Themenpräfix und der UDP-Port bleiben unverändert — auf der Loxone-Seite ist also nichts nachzuziehen. Die vollständige Liste der Änderungen steht in der Datei <tt>NOTICE</tt>."
K25 = "Sprachausgabe für andere Plugins"
K26 = "Ab Werk aus. Eingeschaltet (Reiter <i>Einstellungen</i>, mit eigenem Sprechtoken) können andere Plugins auf diesem LoxBerry eine Ansage auf Google-Lautsprechern abgeben – mit <b>derselben Schnittstelle wie Alexa-NG</b>: POST an <tt>/plugins/&lt;Ordner&gt;/index.php</tt> mit <tt>aktion=sprechen</tt>, <tt>token</tt>, <tt>geraet</tt>, <tt>text</tt>, <tt>laut</tt>. Mit demselben Token setzen sie die Lautstärke (<tt>aktion=lautstaerke</tt>, <tt>wert</tt> 0 bis 100) und lesen die Geräteliste (<tt>aktion=geraete</tt>). Angenommen wird nur von diesem LoxBerry selbst. Die Antwort <tt>SPRECHEN;OK=1;…;GRUND=EINGEREIHT</tt> heißt: der laufende Dienst hat die Ansage bei den verbundenen Lautsprechern eingereiht. Ruhezeit, Lautstärke-Obergrenze, Klang vorab und Fortsetzen gelten wie bei Ansagen aus Loxone; höchstens 60 Aufrufe je Stunde (einstellbar), derselbe Text an dasselbe Gerät innerhalb von 30 s wird nicht wiederholt. Das Sprechtoken wird wie ein Kennwort behandelt: nie angezeigt, nicht in der Sicherung. Einzelheiten im Reiter <i>Einbindung in Loxone</i>; der Reiter <i>Test</i> hat eine Zeile dafür und den Knopf <i>Testansage</i>."
K27 = "Sperre aus Loxone"
K28 = "Ab Werk aus (Haken im Reiter <i>Einstellungen</i>). Loxone hält damit Ansagen an, etwa bei Abwesend, Gäste oder Schlafen: <tt>&lt;Präfix&gt;/server/cmd/sperre</tt> mit 1 sperrt, mit 0 hebt es auf - über den UDP-Eingang des MQTT-Gateways oder als UDP-Befehl <tt>server/SPERRE 1;</tt>; andere Plugins nehmen <tt>aktion=sperre</tt> mit dem Sprechtoken. Gesperrt werden Ansagen aus Loxone und über die Sprachausgabe für andere Plugins übersprungen; dort geht <tt>dringend=1</tt> durch. Musik und Lautstärke bleiben frei. Nach einem Update gilt offen, bis Loxone neu sperrt; der Reiter <i>Test</i> zeigt den Zustand."
K29 = "Google ↔ Loxone"
K30 = "<b>Loxone → Google, mit diesem Plugin:</b> Ansagen auf einem Gerät, einer Google-Lautsprechergruppe oder allen, mit eigener Lautstärke; Lautstärke, Wiedergabe, Favoriten (Radio-Adressen), Stopp und der Zustand mit Titel und Interpret über MQTT oder UDP; die Sprachausgabe für andere Plugins mit derselben Schnittstelle wie Alexa-NG; die Sperre aus Loxone. Geräte: Chromecast, Google Home und Nest, Fernseher mit Chromecast built-in. Beim <b>Google Home Speaker</b> nennt Googles Datenblatt Google Cast nicht; ob er sich als Ansageziel ansprechen lässt, ist nicht gemessen. An einem echten Google-Gerät ist dieses Plugin bisher nicht gemessen."
K31 = "<b>Google → Loxone und Google-Routinen:</b> nicht mit diesem Plugin, sondern über die Matter-Bridge in <b>Matter2Lox</b>. Sie ist in Arbeit; die Kopplung an Google ist noch nicht gemessen. Für eine Bridge mit Test-Herstellerkennung verlangt Google ein Projekt in der <i>Google Home Developer Console</i> (VID 0xFFF1, PID 0x8000), und wer koppelt, muss Mitglied dieses Projekts sein. Den Matter-Hub stellt ein Google-Gerät im Haus, nach Googles Hilfe unter anderem Nest Audio, Nest Mini, Nest Hub, Google TV Streamer und der <b>Google Home Speaker</b> - für ihn nennt der Google Store in den technischen Daten: Kann mit Google Home als Hub für Matter verwendet werden."
K32 = "<b>Was dann Google-Home-Automationen leisten sollen (nicht gemessen):</b> Loxone legt einen Schalter der Bridge um, und eine Automation in der Google-Home-App startet daraufhin eine Durchsage an die Google-Lautsprecher, einen Sprachbefehl oder eine Routine. Umgekehrt löst ein eigener Satz (Hey Google, Abendlicht) eine Automation aus, die einen Schalter der Bridge umlegt - den sieht Loxone."
K33 = "<b>Nicht vorgesehen:</b> Chromecasts und Google-Lautsprecher als Matter-Mediengerät - Alexa und Apple Home bedienen diesen Gerätetyp nicht, und Google kennt die Geräte ohnehin. Eine Anbindung an die Google-Cloud gibt es nicht. Für Alexa- oder Apple-Haushalte lassen sich die Loxone-Bausteine Musik und Lautstärke als Steckdose über die Bridge freigeben (ab Werk nichts freigegeben, nicht gemessen); für Google nicht freigeben, sonst stünde jeder Lautsprecher doppelt in der Google-Home-App."
