; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Chromecast 4 Lox NG"
K02 = "Steuert Google-Cast-Geräte vom Loxone Miniserver aus – Chromecast, Google Home und Nest; beim Google Home Speaker ist Google Cast nicht gemessen – und meldet ihren Zustand zurück: Lautstärke, Wiedergabe, Titel, Interpret und mehr. Der Weg zum Miniserver ist MQTT."
K03 = "Einrichten"
K04 = "Reiter <i>Test</i> → <i>Chromecasts im Netz suchen</i>. Das liefert die Namen, wie sie das Gerät selbst meldet."
K05 = "Reiter <i>Einstellungen</i>: die Namen eintragen, einer je Zeile, und speichern. Der Dienst startet dabei neu."
K06 = "Reiter <i>MQTT</i>: die Haken „Befehle über MQTT annehmen“ und „Lautsprecher über MQTT steuern“ setzen. Reiter <i>Einbindung in Loxone</i>: je Wert einen Virtuellen Eingang nach der Namenstabelle anlegen (Gateway V2: die Datenpunkte anhaken)."
K07 = "In Loxone Config die Vorlage „MQTT-Befehle“ einmal einlesen (Baum Virtuelle Ausgänge → Vordefinierte Geräte → Vorlage Importieren…) – oder die Befehle am Ausgang „LoxBerry MQTT-Gateway“ des Musterprojekts anlegen."
K08 = "Der Name muss stimmen"
K09 = "Das Plugin sucht das Gerät über seinen <b>Anzeigenamen</b>, so wie er in der Google-Home-App steht. Ein Tippfehler oder ein später umbenanntes Gerät führt dazu, dass gar nichts passiert — im Protokoll steht dann <tt>Chromecast '…' nicht gefunden</tt>. Nach einer Umbenennung muss der Name hier nachgezogen werden; mit ihm ändern sich das MQTT-Thema, die Namen der Virtuellen Eingänge und der Befehlsname."
K10 = "Suche findet nichts"
K11 = "Chromecasts melden sich per mDNS im lokalen Netz. Das geht <b>nicht</b> über Netz- oder VLAN-Grenzen. Liegt der LoxBerry in einem anderen Segment als die Lautsprecher, findet die Suche nichts — daran ändert auch eine Firewall-Freigabe für einzelne Ports nichts. Weitere Ursachen: Gerät stromlos, gerade neu gestartet, oder UDP 5353 blockiert."
K12 = "Wiedergabe starten"
K13 = "Über die Befehlsbrücke setzt <tt>play</tt> nur fort; ein Medium startet man mit <tt>play_favorit</tt> (Favoriten im Reiter Einstellungen). Auf dem alten Befehlsweg erwartet <tt>play</tt> als Nutzlast die <b>direkte URL</b> eines Mediums, etwa einen MP3-Stream eines Radiosenders. Eine Playlist-Datei (<tt>.m3u</tt>, <tt>.pls</tt>) versteht der Chromecast nicht — dort muss die darin enthaltene Stream-Adresse eingetragen werden."
K14 = "MQTT oder UDP"
K15 = "<b>MQTT ist der empfohlene Weg.</b> Retained, also nach einem Neustart des Miniservers sofort wieder da, kommen <tt>state</tt>, <tt>playing</tt>, <tt>volume</tt>, <tt>muted</tt>, <tt>duration</tt>, <tt>type</tt>, <tt>group</tt>, <tt>favorit</tt> und <tt>tts_active</tt> sowie <tt>server/online</tt> und <tt>server/fassung</tt>. Flüchtig gehen <tt>online</tt>, <tt>app</tt>, <tt>title</tt>, <tt>artist</tt>, <tt>album</tt>, <tt>position</tt> und <tt>last_error</tt> hinaus, ebenso das Lebenszeichen <tt>server/ts</tt>, <tt>server/zaehler</tt>, <tt>server/geraete</tt> und <tt>server/verluste</tt>. Ob der Dienst lebt, sagen <tt>server/online</tt> (Letzter Wille) und <tt>server/zaehler</tt> — nicht das <tt>online</tt> eines Lautsprechers. Befehle schickt der Miniserver an den UDP-Eingang des MQTT-Gateways, das Gateway macht daraus MQTT; ein retained gesendeter Befehl wird verworfen, nicht ausgeführt, und beim Verbinden am Broker gelöscht und nachgelesen; was nach drei Versuchen noch steht, nennt der Reiter <i>Test</i>. Über MQTT braucht jeder Befehl einen Wert (z. B. 1); eine leere Nachricht wird nie ausgeführt. Eine absolute Lautstärke (<tt>volume</tt>), die mit demselben wirksamen Wert vor weniger als 60 s schon gesetzt wurde, wird nicht erneut gesendet (Protokoll: <tt>UNVERAENDERT=1</tt>); Schritte, lauter/leiser, <tt>mute</tt> und Tasten gehen immer hinaus. Seit 1.3.25 zählt der Reiter Test unter MQTT-Gateway V2 nach, ob alle Datenpunkte der Hakenliste angehakt sind und „Noncached“ stimmt."
K16 = "Der <b>UDP-Weg</b> ist der Weg der Originalfassung und bleibt für bestehende Anlagen erhalten; bei einer Neuinstallation ist er seit 1.3.24 ab Werk aus. Er nimmt Textbefehle direkt entgegen und braucht kein Gateway — aber nur von den Miniservern aus den LoxBerry-Einstellungen und von diesem LoxBerry selbst; alles andere wird verworfen und im Protokoll vermerkt."
K17 = "Was sich gegenüber 0.2.31 geändert hat"
K18 = "Der Dienst läuft unter <b>Python 3</b>. Die alte Fassung war Python 2 und startete auf LoxBerry 4 gar nicht mehr."
K19 = "Gesteuert wird über <b>pychromecast</b> statt der mitgelieferten Go-Binärdatei. Von der gab es keine arm64-Fassung."
K20 = "<b>Mehrere Geräte</b> statt genau einem."
K21 = "Der Dienst läuft als Benutzer <tt>loxberry</tt>, nicht mehr als <tt>root</tt>."
K22 = "Herkunft und Lizenz"
K23 = "Grundlage ist das Plugin <b>Chromecast 4 Lox</b> von <b>Aleš Berka (Aleq)</b>, Fassung 0.2.31, unter der Apache-Lizenz 2.0 (<a href='http://aleq.eu/chromecast4lox/' target='_blank'>aleq.eu/chromecast4lox</a>). Das Original wird seit 2022 nicht mehr betreut."
K24 = "Diese Fortführung heißt seit 1.2.1 <b>Chromecast 4 Lox NG</b> und hat eine eigene Kennung, damit LoxBerry sie von der Originalfassung unterscheiden kann und Fehlerberichte nicht beim Originalautor landen. Das MQTT-Themenpräfix und der UDP-Port bleiben unverändert — auf der Loxone-Seite ist also nichts nachzuziehen. Die vollständige Liste der Änderungen steht in der Datei <tt>NOTICE</tt>."
K25 = "Sprachausgabe für andere Plugins"
K26 = "Ab Werk aus. Eingeschaltet (Reiter <i>Einstellungen</i>, mit eigenem Sprechtoken) können andere Plugins auf diesem LoxBerry eine Ansage auf Google-Lautsprechern abgeben – mit <b>derselben Schnittstelle wie Alexa-NG</b>: POST an <tt>/plugins/&lt;Ordner&gt;/index.php</tt> mit <tt>aktion=sprechen</tt>, <tt>token</tt>, <tt>geraet</tt>, <tt>text</tt>, <tt>laut</tt>. Mit demselben Token setzen sie die Lautstärke (<tt>aktion=lautstaerke</tt>, <tt>wert</tt> 0 bis 100) und lesen die Geräteliste (<tt>aktion=geraete</tt>). Angenommen wird nur von diesem LoxBerry selbst. Die Antwort <tt>SPRECHEN;OK=1;…;GRUND=EINGEREIHT</tt> heißt: der laufende Dienst hat die Ansage bei den verbundenen Lautsprechern eingereiht. Ruhezeit, Lautstärke-Obergrenze, Klang vorab und Fortsetzen gelten wie bei Ansagen aus Loxone; höchstens 60 Aufrufe je Stunde (einstellbar), derselbe Text an dasselbe Gerät innerhalb von 5 s gilt als Doppelauslösung und wird mit 429 DOPPELT abgewiesen, nicht als gesendet gemeldet. Das Sprechtoken wird wie ein Kennwort behandelt: nie angezeigt, nicht in der Sicherung. Einzelheiten im Reiter <i>Einbindung in Loxone</i>; der Reiter <i>Test</i> hat eine Zeile dafür und den Knopf <i>Testansage</i>."
K27 = "Sperre aus Loxone"
K28 = "Ab Werk aus (Haken im Reiter <i>Einstellungen</i>). Loxone hält damit Ansagen an, etwa bei Abwesend, Gäste oder Schlafen: <tt>&lt;Präfix&gt;/server/cmd/sperre</tt> mit 1 sperrt, mit 0 hebt es auf - über den UDP-Eingang des MQTT-Gateways oder als UDP-Befehl <tt>server/SPERRE 1;</tt>; andere Plugins nehmen <tt>aktion=sperre</tt> mit dem Sprechtoken. Gesperrt werden Ansagen aus Loxone und über die Sprachausgabe für andere Plugins übersprungen; dort geht <tt>dringend=1</tt> durch. Musik und Lautstärke bleiben frei. Nach einem Update gilt offen, bis Loxone neu sperrt; der Reiter <i>Test</i> zeigt den Zustand."
K29 = "Google ↔ Loxone"
K30 = "<b>Loxone → Google, mit diesem Plugin:</b> Ansagen auf einem Gerät, einer Google-Lautsprechergruppe oder allen, mit eigener Lautstärke; Lautstärke, Wiedergabe, Favoriten (Radio-Adressen), Stopp und der Zustand mit Titel und Interpret über MQTT oder UDP; die Sprachausgabe für andere Plugins mit derselben Schnittstelle wie Alexa-NG; die Sperre aus Loxone. Geräte: Chromecast, Google Home und Nest, Fernseher mit Chromecast built-in. Beim <b>Google Home Speaker</b> nennt Googles Datenblatt Google Cast nicht; ob er sich als Ansageziel ansprechen lässt, ist nicht gemessen. An einem echten Google-Gerät ist dieses Plugin bisher nicht gemessen."
K31 = "<b>Google → Loxone und Google-Routinen:</b> nicht mit diesem Plugin, sondern über die Matter-Bridge in <b>Matter2Lox</b>. Sie ist in Arbeit; die Kopplung an Google ist noch nicht gemessen. Für eine Bridge mit Test-Herstellerkennung verlangt Google ein Projekt in der <i>Google Home Developer Console</i> (VID 0xFFF1, PID 0x8000), und wer koppelt, muss Mitglied dieses Projekts sein. Den Matter-Hub stellt ein Google-Gerät im Haus, nach Googles Hilfe unter anderem Nest Audio, Nest Mini, Nest Hub, Google TV Streamer und der <b>Google Home Speaker</b> - für ihn nennt der Google Store in den technischen Daten: Kann mit Google Home als Hub für Matter verwendet werden."
K32 = "<b>Was dann Google-Home-Automationen leisten sollen (nicht gemessen):</b> Loxone legt einen Schalter der Bridge um, und eine Automation in der Google-Home-App startet daraufhin eine Durchsage an die Google-Lautsprecher, einen Sprachbefehl oder eine Routine. Umgekehrt löst ein eigener Satz (Hey Google, Abendlicht) eine Automation aus, die einen Schalter der Bridge umlegt - den sieht Loxone."
K33 = "<b>Nicht vorgesehen:</b> Chromecasts und Google-Lautsprecher als Matter-Mediengerät - Alexa und Apple Home bedienen diesen Gerätetyp nicht, und Google kennt die Geräte ohnehin. Eine Anbindung an die Google-Cloud gibt es nicht. Für Alexa- oder Apple-Haushalte lassen sich die Loxone-Bausteine Musik und Lautstärke als Steckdose über die Bridge freigeben (ab Werk nichts freigegeben, nicht gemessen); für Google nicht freigeben, sonst stünde jeder Lautsprecher doppelt in der Google-Home-App."
K34 = "Befehle über MQTT (seit 1.3.24)"
K35 = "Befehle gehen über die gemeinsame Befehlsbrücke: <tt>&lt;Präfix&gt;/befehl/&lt;Befehlsname&gt;/&lt;Befehl&gt;</tt> (Befehlsname = Gerätethema klein, <tt>-</tt> wird <tt>_</tt>; <tt>alle</tt> für alle) und <tt>&lt;Präfix&gt;/befehl/sperre</tt>. Ab Werk aus: Haken „Befehle über MQTT annehmen“ im Reiter <i>MQTT</i>; alles Hörbare braucht zusätzlich „Lautsprecher über MQTT steuern“. Jede Nachricht bekommt eine Quittung unter <tt>…/quittung</tt>. Ausgeführt wird im Dienst an derselben Stelle wie auf dem alten Weg: Sperre aus Loxone, gleiche Lautstärke binnen 60 s, Obergrenze und Ruhezeit gelten. Werte melden <tt>-1</tt>, wenn sie unbekannt sind. Der alte Weg <tt>&lt;Präfix&gt;/&lt;Gerät&gt;/cmd/…</tt> steht hinter dem Haken „Alten Befehlsweg annehmen“ – nach einem Update an, bei einer Neuinstallation aus."
K36 = "Audio (seit 1.3.25)"
K37 = "Reiter <i>Audio</i>: <b>Zonen</b> mit fester Nummer (1-24) auf einen Lautsprecher oder eine Google-Lautsprechergruppe - Themen <tt>&lt;Präfix&gt;/zone/&lt;Nr&gt;/…</tt>, Befehle <tt>…/befehl/zone_&lt;Nr&gt;/…</tt>; eine Umbenennung in Google Home bricht nichts. <b>Quellen</b> (1-99) für Radiotasten: Radiosender, Wiedergabelisten (Ordner oder M3U) und Dateien aus der <b>Medienablage</b> (USB-Datenträger oder Netzfreigabe, im Heimnetz über einen zufälligen Pfadschlüssel erreichbar). <b>Klingel</b>: <tt>…/befehl/klingel</tt> auf eine Google-Gruppe, bei Ausfall parallel auf die Rückfallliste. Der Music Server läuft weiter."
K39 = "<b>Externes Laufwerk für die Medienablage:</b> am LoxBerry ext4 am besten (Rechte, Stabilität); exFAT gut, wenn die Platte auch am Windows-PC befüllt wird (Debian 13 kann exFAT im Kernel); NTFS geht (Kernel-Treiber ntfs3), aber nur als Notlösung (keine Linux-Rechte, nach unsauberem Abziehen eventuell nur lesbar); FAT32 nicht (4-GB-Grenze, Umlaute). Laufwerk an der FRITZ!Box: exFAT oder NTFS, als Netzwerkfreigabe (SMB) einbinden. Strom: der Pi 4 gibt über USB zusammen etwa 1,2 A ab - NVMe-Gehäuse ggf. nur mit aktivem USB-Hub. Der Reiter <i>Audio</i> zeigt das erkannte Dateisystem."
K38 = "<b>Lautstärke:</b> gesetzt wird in ganzen Prozent und unverändert gesendet; die Protokollzeile von pychromecast zeigt nur eine Nachkommastelle (25 % erscheint als 0.2). Zehnerschritte gibt es nicht - am 30.10.2026 meldeten beide Google Home Speaker 45 %."
K40 = "<b>Klingel und Gong:</b> Google spielt beim Start einer Wiedergabe einen kurzen eigenen Ton („Dip“), das Plugin kann ihn nicht abschalten. Ein eigener Gong sollte mit etwa 0,3-0,5 s Stille beginnen und weich einblenden, sonst knackt es. Klingelt eine Google-Gruppe, verstummt, was auf ihren Lautsprechern lief; mit „danach fortsetzen“ spielt es danach weiter (Radio neu, Liste und Datei an der Stelle)."
K41 = "<b>Gruppen und ihre Mitglieder:</b> Der Dienst fragt jede eingetragene Google-Gruppe beim Verbinden nach ihren Mitgliedern (eine reine Statusabfrage, es wird nichts gespielt) und übernimmt jede Änderung, die die Gruppe meldet. Der Reiter <i>Audio</i> zeigt sie bei den Zonen; <tt>zone/&lt;Nr&gt;/mitglied_von</tt> nennt die Gruppen eines Lautsprechers (mit ; getrennt, retained; - = in keiner). Ist der Klingel-Rückfall leer, klingeln die gemeldeten Mitglieder der Klingel-Gruppe - solange keine gemeldet sind, wie bisher alle Lautsprecher ohne Fernseher."
K42 = "<b>Medienablage auswählen:</b> Der Reiter <i>Audio</i> bietet mit der Speicherauswahl von LoxBerry an, was LoxBerry eingehängt hat - USB-Datenträger und Netzwerkfreigaben - samt <i>Unterverzeichnis</i>; <i>Benutzerdefinierter Pfad</i> und <i>Erweitert: Pfad von Hand</i> nehmen jeden anderen Ordner unter /media oder /mnt. <b>FRITZ!Box:</b> dort <i>Heimnetz → USB / Speicher → Speicher (NAS)</i> aktiv, unter <i>System → FRITZ!Box-Benutzer</i> ein Benutzer mit „Zugang zu NAS-Inhalten“; im LoxBerry unter <i>Netzwerkfreigaben</i> Server <tt>192.168.178.1</tt> bzw. <tt>fritz.box</tt>, SMB, Benutzer und Kennwort. Die Freigabe erscheint dann als <tt>…/system/storage/smb/&lt;Server&gt;/&lt;Freigabe&gt;</tt>."
K43 = "<b>Zweite Sperre der Medienablage:</b> Unabhängig von der Durchsicht beim Einrichten liefert der Webserver unter <tt>m_&lt;Pfadschlüssel&gt;/</tt> nie ein Programm aus: <tt>.php</tt> (auch <tt>.php5</tt> …), <tt>.phtml</tt>, <tt>.phar</tt>, <tt>.cgi</tt>, <tt>.pl</tt>, <tt>.py</tt>, <tt>.sh</tt> und <tt>.shtml</tt> - auch groß geschrieben und mitten im Namen - antworten mit 404, alles andere kommt dort nur als Datei (kein PHP, kein CGI). Eine Audiodatei mit einem solchen Namensteil wird deshalb nicht abgespielt. <b>Empfehlung:</b> für die Netzwerkfreigabe einen FRITZ!Box-Benutzer <b>nur mit Leserecht</b> nehmen und als Ablage einen eigenen Musik-Unterordner, nicht die ganze Platte - dann kann über den LoxBerry niemand Dateien in die Ablage legen."
K44 = "<b>Wache der Medienablage:</b> Der Dienst sieht die freigegebene Ablage alle 15 Minuten erneut durch (nicht während einer Klingel oder Ansage, höchstens 120 s und 50 000 Einträge - reicht das nicht, bleibt die Freigabe, wie sie ist). Findet er eine <tt>.ht*</tt>-Datei, eine Programm-Endung (auch mitten im Namen, z. B. <tt>lied.php.mp3</tt>) oder einen Verweis nach außen, zieht er die Freigabe sofort zurück: Zustand <i>unsichere Datei gefunden: &lt;Pfad&gt;</i>, <tt>server/ablage_ok</tt> 0, Eintrag im Protokoll. Ist die Datei entfernt oder umbenannt, gibt der nächste Durchgang die Ablage wieder frei."
K45 = "<b>Klingel-Gong unabhängig von der Musik:</b> Ein Dateiname im Feld <i>Gong</i> gilt relativ zur Medienablage. Wechselt die Ablage (z. B. vom USB-Datenträger zur FRITZ!Box), fehlt die Datei dort womöglich - dann klingt der eigene Gong (Reiter <i>Audio</i>, hochgeladen: MP3/OGG/WAV bis 1 MB; er liegt bei den Einstellungen des Plugins und übersteht ein Update) oder der mitgelieferte Standard-Gong (0,4 s Stille, weich eingeblendeter Zweiklang, vom Plugin selbst erzeugt). Die Klingel bleibt nie stumm; das Protokoll nennt den Rückfall, und der Reiter <i>Test</i> warnt bei Quellen und Gong, deren Datei in der Ablage fehlt."
K46 = "<b>Dateiarten der Medienablage:</b> Ordner, M3U-Listen und Dateiquellen spielen <tt>.mp3</tt>, <tt>.m4a</tt>, <tt>.aac</tt>, <tt>.flac</tt>, <tt>.ogg</tt>, <tt>.oga</tt>, <tt>.opus</tt>, <tt>.wav</tt>, <tt>.webm</tt> und <tt>.mp4</tt>. Bei <tt>.mp4</tt> spielt der Lautsprecher den Ton (AAC) - bei Videos nur der Ton, ein Bild gibt es nicht. Die Zahl der Audiodateien im Reiter <i>Audio</i> zählt <tt>.mp4</tt> mit; andere Dateien (z. B. <tt>.mkv</tt>, <tt>.m4v</tt>, Bilder) übergeht der Dienst. Der eigene Gong bleibt MP3, OGG oder WAV."
K47 = "<b>Befehle einer Zone oder eines Lautsprechers</b> (<tt>…/befehl/zone_&lt;Nr&gt;/…</tt> bzw. <tt>…/befehl/&lt;Befehlsname&gt;/…</tt>): <tt>quelle</tt> (Nummer, <tt>0</tt> hält an), <tt>play</tt>, <tt>pause</tt>, <tt>stop</tt>, <tt>quit</tt>, <tt>next</tt> (nächster Titel), <tt>prev</tt> (voriger Titel), <tt>seek</tt>, <tt>volume</tt>, <tt>volume_step</tt>, <tt>volume_up</tt>, <tt>volume_down</tt>, <tt>mute</tt>, <tt>play_favorit</tt>, <tt>tts</tt>, <tt>tts_stop</tt>, <tt>klingel</tt>; dazu <tt>…/befehl/klingel</tt> (Standardziel) und <tt>…/befehl/sperre</tt>. Die Befehle heißen englisch: „weiter“ oder „zurück“ kennt die Befehlsbrücke nicht (im Protokoll „unbekannter Befehl“) – der nächste Titel ist <tt>next</tt>, der vorige <tt>prev</tt>."
K48 = "<b>Klingel bei laufender Musik, neu angelegte Gruppe, hängende Netzfreigabe (seit 1.3.26):</b> Spielt ein Mitglied der Klingel-Gruppe gerade etwas, das sich fortsetzen lässt, hält der Dienst es vor dem Gong an (bis es „IDLE“ meldet, höchstens 1,2 s) – so kommt der Gong auf allen Lautsprechern zugleich; danach spielt es weiter. Das gilt mit dem Haken „Nach der Ansage fortsetzen, was vorher lief“. Wird eine Gruppe in Google Home gelöscht und neu angelegt, verwirft der Dienst die alte Verbindung nach 60 s oder zwei Fehlschlägen und sucht die Gruppe über ihren Namen neu; eine Klingel sucht sofort einmal neu (höchstens 2 s), sonst greift der Rückfall. Er geht an alle zuletzt bekannten Mitglieder, auch an gerade nicht verbundene. Hängt die Netzfreigabe der Medienablage („Stale file handle“, etwa nach Ab- und Anstecken der SSD an der FRITZ!Box), meldet der Reiter <i>Test</i> das samt Abhilfe, <tt>server/ablage_ok</tt> wird 0, und eine Listen- oder Dateiquelle meldet „Wiedergabe kam nicht zustande“ statt „gestartet“. Ist die Freigabe wieder lesbar, gibt der Dienst die Ablage selbst wieder frei."
