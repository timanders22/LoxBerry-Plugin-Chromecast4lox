; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Chromecast 4 Lox NG"
K02 = "Controls Google Chromecast devices from the Loxone Miniserver and reports their state back — volume, playback, title, artist and more. The path to the Miniserver is MQTT."
K03 = "Set up in four steps"
K04 = "<i>Test</i> tab → <i>Search for Chromecasts on the network</i>. This gives you the names as the device itself reports them."
K05 = "<i>Settings</i> tab: enter the names, one per line, and save. The service restarts as you do so."
K06 = "<i>Loxone integration</i> tab: download both templates."
K07 = "In Loxone Config: right-click the Miniserver → <i>Paste template</i> — once per file."
K08 = "The name has to be right"
K09 = "The plugin finds the device by its <b>display name</b>, exactly as it appears in the Google Home app. A typo or a device renamed later means nothing happens at all — the log then says <tt>Chromecast '…' not found</tt>. After renaming, the name has to be updated here and the Loxone template regenerated, because the MQTT topic changes with it."
K10 = "The search finds nothing"
K11 = "Chromecasts announce themselves by mDNS on the local network. That does <b>not</b> cross network or VLAN boundaries. If the LoxBerry sits in a different segment from the speakers, the search finds nothing — and opening individual ports on the firewall does not change that. Other causes: the device has no power, has just restarted, or UDP 5353 is blocked."
K12 = "Starting playback"
K13 = "The <tt>play</tt> command expects the <b>direct URL</b> of a medium as its payload, for example the MP3 stream of a radio station. A playlist file (<tt>.m3u</tt>, <tt>.pls</tt>) is not understood by the Chromecast — you have to enter the stream address contained inside it. Without a payload, <tt>play</tt> resumes paused playback."
K14 = "MQTT or UDP"
K15 = "<b>MQTT is the recommended way.</b> The states arrive retained; after a restart of the Miniserver the last state is there again immediately. The Miniserver sends commands to the UDP input of the MQTT gateway, and the gateway turns them into MQTT."
K16 = "The <b>UDP path</b> is the way of the original version and is kept. It accepts text commands directly and needs no gateway."
K17 = "What has changed since 0.2.31"
K18 = "The service runs under <b>Python 3</b>. The old version was Python 2 and would no longer start at all on LoxBerry 4."
K19 = "Control goes through <b>pychromecast</b> instead of the bundled Go binary. There was no arm64 build of that."
K20 = "<b>Several devices</b> instead of exactly one."
K21 = "The service runs as the user <tt>loxberry</tt>, no longer as <tt>root</tt>."
K22 = "Origin and licence"
K23 = "The basis is the plugin <b>Chromecast 4 Lox</b> by <b>Aleš Berka (Aleq)</b>, version 0.2.31, under the Apache licence 2.0 (<a href='http://aleq.eu/chromecast4lox/' target='_blank'>aleq.eu/chromecast4lox</a>). The original has been unmaintained since 2022."
K24 = "Since 1.2.1 this continuation is called <b>Chromecast 4 Lox NG</b> and has an identifier of its own, so that LoxBerry can tell it apart from the original and bug reports do not end up with the original author. The MQTT topic prefix and the UDP port are unchanged — so nothing needs adjusting on the Loxone side. The complete list of changes is in the file <tt>NOTICE</tt>."
