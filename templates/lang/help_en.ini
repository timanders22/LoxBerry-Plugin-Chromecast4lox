; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Chromecast 4 Lox NG"
K02 = "Controls Google Cast devices from the Loxone Miniserver – Chromecast, Google Home and Nest; for the Google Home Speaker Google Cast is not measured – and reports their state back: volume, playback, title, artist and more. The path to the Miniserver is MQTT."
K03 = "Setting up"
K04 = "Tab <i>Test</i> → <i>Search Chromecasts in the network</i>. This delivers the names as the device itself reports them."
K05 = "Tab <i>Settings</i>: enter the names, one per line, and save. The service restarts."
K06 = "Tab <i>MQTT</i>: tick “Accept commands via MQTT” and “Control speakers via MQTT”. Tab <i>Integration into Loxone</i>: create one virtual input per value according to the name table (gateway V2: tick the data points)."
K07 = "In Loxone Config import the template “MQTT commands” once (tree Virtual outputs → Predefined devices → Import template…) – or create the commands at the output “LoxBerry MQTT-Gateway” of the sample project."
K08 = "The name has to be right"
K09 = "The plugin finds the device by its <b>display name</b> as shown in the Google Home app. A typo or a device renamed later means nothing happens at all — the log then says <tt>Chromecast '…' nicht gefunden</tt>. After renaming, the name must be updated here; with it the MQTT topic, the names of the virtual inputs and the command name change."
K10 = "The search finds nothing"
K11 = "Chromecasts announce themselves by mDNS on the local network. That does <b>not</b> cross network or VLAN boundaries. If the LoxBerry sits in a different segment from the speakers, the search finds nothing — and opening individual ports on the firewall does not change that. Other causes: the device has no power, has just restarted, or UDP 5353 is blocked."
K12 = "Starting playback"
K13 = "Through the command bridge <tt>play</tt> only resumes; a medium is started with <tt>play_favorit</tt> (favourites on the Settings tab). On the old command path <tt>play</tt> expects the <b>direct URL</b> of a medium as payload, for example the MP3 stream of a radio station. A playlist file (<tt>.m3u</tt>, <tt>.pls</tt>) is not understood by the Chromecast — the stream address it contains must be entered instead."
K14 = "MQTT or UDP"
K15 = "<b>MQTT is the recommended way.</b> Retained, i.e. back at once after a restart of the Miniserver, are <tt>state</tt>, <tt>playing</tt>, <tt>volume</tt>, <tt>muted</tt>, <tt>duration</tt>, <tt>type</tt>, <tt>group</tt>, <tt>favorit</tt> and <tt>tts_active</tt>, plus <tt>server/online</tt> and <tt>server/fassung</tt>. Not retained are <tt>online</tt>, <tt>app</tt>, <tt>title</tt>, <tt>artist</tt>, <tt>album</tt>, <tt>position</tt> and <tt>last_error</tt>, and the sign of life <tt>server/ts</tt>, <tt>server/zaehler</tt>, <tt>server/geraete</tt> and <tt>server/verluste</tt>. Whether the service is alive is told by <tt>server/online</tt> (last will) and <tt>server/zaehler</tt> — not by the <tt>online</tt> of a speaker. The Miniserver sends commands to the UDP input of the MQTT gateway, and the gateway turns them into MQTT; a command sent retained is discarded, not executed, and on connecting it is deleted at the broker and read back; whatever is still there after three attempts is named on the <i>Test</i> tab. Over MQTT every command needs a value (e.g. 1); an empty message is never executed. An absolute volume (<tt>volume</tt>) that was already set to the same effective value less than 60 s ago is not sent again (log: <tt>UNVERAENDERT=1</tt>); steps, louder/quieter, <tt>mute</tt> and buttons always go out. Since 1.3.25 the Test tab checks under MQTT gateway V2 that all data points of the tick list are ticked and “Noncached” is right."
K16 = "The <b>UDP path</b> is the path of the original version and remains for existing installations; since 1.3.24 it is off by default for a new installation. It takes text commands directly and needs no gateway — but only from the Miniservers in the LoxBerry settings and from this LoxBerry itself; everything else is discarded and noted in the log."
K17 = "What has changed since 0.2.31"
K18 = "The service runs under <b>Python 3</b>. The old version was Python 2 and would no longer start at all on LoxBerry 4."
K19 = "Control goes through <b>pychromecast</b> instead of the bundled Go binary. There was no arm64 build of that."
K20 = "<b>Several devices</b> instead of exactly one."
K21 = "The service runs as the user <tt>loxberry</tt>, no longer as <tt>root</tt>."
K22 = "Origin and licence"
K23 = "The basis is the plugin <b>Chromecast 4 Lox</b> by <b>Aleš Berka (Aleq)</b>, version 0.2.31, under the Apache licence 2.0 (<a href='http://aleq.eu/chromecast4lox/' target='_blank'>aleq.eu/chromecast4lox</a>). The original has been unmaintained since 2022."
K24 = "Since 1.2.1 this continuation is called <b>Chromecast 4 Lox NG</b> and has an identifier of its own, so that LoxBerry can tell it apart from the original and bug reports do not end up with the original author. The MQTT topic prefix and the UDP port are unchanged — so nothing needs adjusting on the Loxone side. The complete list of changes is in the file <tt>NOTICE</tt>."
K25 = "Speech output for other plugins"
K26 = "Off by default. Switched on (<i>Settings</i> tab, with its own speech token), other plugins on this LoxBerry can make an announcement on Google speakers – with <b>the same interface as Alexa-NG</b>: POST to <tt>/plugins/&lt;folder&gt;/index.php</tt> with <tt>aktion=sprechen</tt>, <tt>token</tt>, <tt>geraet</tt>, <tt>text</tt>, <tt>laut</tt>. With the same token they set the volume (<tt>aktion=lautstaerke</tt>, <tt>wert</tt> 0 to 100) and read the device list (<tt>aktion=geraete</tt>). Only calls from this LoxBerry itself are accepted. The answer <tt>SPRECHEN;OK=1;…;GRUND=EINGEREIHT</tt> means: the running service has queued the announcement for the connected speakers. Quiet hours, volume limit, chime and resume apply as for announcements from Loxone; at most 60 calls per hour (adjustable), the same text to the same device within 5 s counts as a double trigger and is refused with 429 DOPPELT, not reported as sent. The speech token is treated like a password: never shown, not in the backup. Details in the <i>Integration in Loxone</i> tab; the <i>Test</i> tab has a line for it and the button <i>Test announcement</i>."
K27 = "Lock from Loxone"
K28 = "Off by default (tick in the <i>Settings</i> tab). With it Loxone holds announcements, for example when away, with guests or at night: <tt>&lt;prefix&gt;/server/cmd/sperre</tt> with 1 locks, with 0 unlocks - via the UDP input of the MQTT gateway or as UDP command <tt>server/SPERRE 1;</tt>; other plugins use <tt>aktion=sperre</tt> with the speech token. While locked, announcements from Loxone and through the speech output for other plugins are skipped; there <tt>dringend=1</tt> gets through. Music and volume stay free. After an update open applies until Loxone locks again; the <i>Test</i> tab shows the state."
K29 = "Google ↔ Loxone"
K30 = "<b>Loxone → Google, with this plugin:</b> announcements on one device, a Google speaker group or all, with their own volume; volume, playback, favourites (radio addresses), stop and the state with title and artist over MQTT or UDP; the speech output for other plugins with the same interface as Alexa-NG; the lock from Loxone. Devices: Chromecast, Google Home and Nest, TVs with Chromecast built-in. For the <b>Google Home Speaker</b> Google's data sheet does not list Google Cast; whether it can be addressed as an announcement target is not measured. This plugin has not yet been measured on a real Google device."
K31 = "<b>Google → Loxone and Google routines:</b> not with this plugin but through the Matter bridge in <b>Matter2Lox</b>. It is work in progress; pairing with Google is not measured yet. For a bridge with a test vendor ID Google requires a project in the <i>Google Home Developer Console</i> (VID 0xFFF1, PID 0x8000), and whoever pairs must be a member of that project. The Matter hub is a Google device in the house, according to Google's help among others Nest Audio, Nest Mini, Nest Hub, Google TV Streamer and the <b>Google Home Speaker</b> - for it the Google Store tech specs state that it can be used as a hub for Matter with Google Home."
K32 = "<b>What Google Home automations are then meant to do (not measured):</b> Loxone flips a switch of the bridge, and an automation in the Google Home app then starts a broadcast to the Google speakers, a voice command or a routine. The other way round a sentence of your own (Hey Google, evening light) starts an automation that flips a switch of the bridge - Loxone sees it."
K33 = "<b>Not intended:</b> Chromecasts and Google speakers as Matter media devices - Alexa and Apple Home do not serve this device type, and Google knows the devices anyway. There is no connection to the Google cloud. For Alexa or Apple households the Loxone blocks music and volume can be shared as an outlet through the bridge (nothing shared by default, not measured); do not share them with Google, otherwise every speaker would appear twice in the Google Home app."
K34 = "Commands via MQTT (since 1.3.24)"
K35 = "Commands go through the common command bridge: <tt>&lt;prefix&gt;/befehl/&lt;command name&gt;/&lt;command&gt;</tt> (command name = device topic in lower case, <tt>-</tt> becomes <tt>_</tt>; <tt>alle</tt> for all) and <tt>&lt;prefix&gt;/befehl/sperre</tt>. Off by default: tick “Accept commands via MQTT” on the tab <i>MQTT</i>; everything audible also needs “Control speakers via MQTT”. Every message gets an acknowledgement under <tt>…/quittung</tt>. It is carried out in the service at the same place as on the old path: lock from Loxone, same volume within 60 s, upper limit and quiet time apply. Values report <tt>-1</tt> when unknown. The old path <tt>&lt;prefix&gt;/&lt;device&gt;/cmd/…</tt> is behind the tick “Accept old command path” – on after an update, off for a new installation."
K36 = "Audio (since 1.3.25)"
K37 = "<i>Audio</i> tab: <b>zones</b> with a fixed number (1-24) pointing to a speaker or a Google speaker group - topics <tt>&lt;prefix&gt;/zone/&lt;No&gt;/…</tt>, commands <tt>…/befehl/zone_&lt;No&gt;/…</tt>; renaming in Google Home breaks nothing. <b>Sources</b> (1-99) for radio buttons: radio stations, playlists (folder or M3U) and files from the <b>media store</b> (USB drive or network share, reachable on the home network via a random path key). <b>Doorbell</b>: <tt>…/befehl/klingel</tt> on a Google group, in parallel on the fallback list if it fails. The Music Server keeps running."
K39 = "<b>External drive for the media store:</b> ext4 is best on the LoxBerry (permissions, stability); exFAT is good if the drive is also filled on a Windows PC (Debian 13 supports exFAT in the kernel); NTFS works (kernel driver ntfs3) but only as a stopgap (no Linux permissions, possibly read-only after unsafe removal); not FAT32 (4 GB limit, umlauts). Drive on a FRITZ!Box: exFAT or NTFS, attached as an SMB network share. Power: the Pi 4 supplies about 1.2 A in total over USB - an NVMe enclosure may need a powered USB hub. The <i>Audio</i> tab shows the detected file system."
K38 = "<b>Volume:</b> set in whole percent and sent unchanged; the pychromecast log line shows only one decimal (25 % appears as 0.2). There are no steps of ten - on 30.10.2026 both Google Home Speakers reported 45 %."
K40 = "<b>Doorbell and chime:</b> Google plays a short sound of its own when playback starts (the “dip”); the plugin cannot switch it off. Your own chime should start with about 0.3-0.5 s of silence and fade in softly, otherwise it clicks. When a Google group rings, whatever was playing on its speakers stops; with “resume” on it continues afterwards (radio restarts, list and file at their position)."
K41 = "<b>Groups and their members:</b> When it connects, the service asks every entered Google group for its members (a pure status query, nothing is played) and takes over every change the group reports. The <i>Audio</i> tab shows them with the zones; <tt>zone/&lt;No&gt;/mitglied_von</tt> names the groups of a speaker (separated by ;, retained; - = none). With an empty doorbell fallback, the reported members of the doorbell group ring - as long as none are reported, all speakers without TVs, as before."
K42 = "<b>Choosing the media store:</b> The <i>Audio</i> tab offers, with the LoxBerry storage selection, what LoxBerry has mounted - USB drives and network shares - plus a <i>Subfolder</i>; <i>Custom path</i> and <i>Advanced: path by hand</i> take any other folder below /media or /mnt. <b>FRITZ!Box:</b> enable <i>Home Network → USB / Storage → Storage (NAS)</i> there and create a user with “Access to NAS contents” under <i>System → FRITZ!Box Users</i>; on the LoxBerry add the server <tt>192.168.178.1</tt> or <tt>fritz.box</tt> under <i>Network shares</i>, SMB, user and password. The share then appears as <tt>…/system/storage/smb/&lt;server&gt;/&lt;share&gt;</tt>."
K43 = "<b>Second lock for the media store:</b> Independently of the check when the store is set up, the web server never delivers a program below <tt>m_&lt;path key&gt;/</tt>: <tt>.php</tt> (also <tt>.php5</tt> …), <tt>.phtml</tt>, <tt>.phar</tt>, <tt>.cgi</tt>, <tt>.pl</tt>, <tt>.py</tt>, <tt>.sh</tt> and <tt>.shtml</tt> - in any case and also inside a name - answer 404, everything else is served there as a plain file only (no PHP, no CGI). An audio file with such a name part is therefore not played. <b>Recommendation:</b> use a FRITZ!Box user with <b>read access only</b> for the network share and a dedicated music subfolder as the store, not the whole drive - then nobody can put files into the store through the LoxBerry."
K44 = "<b>Media store watch:</b> The service checks the released store again every 15 minutes (not during a doorbell or announcement, at most 120 s and 50,000 entries - if that is not enough, the release stays as it is). If it finds a <tt>.ht*</tt> file, a program extension (also inside a name, e.g. <tt>song.php.mp3</tt>) or a link pointing outside, it withdraws the release at once: state <i>unsafe file found: &lt;path&gt;</i>, <tt>server/ablage_ok</tt> 0, a log entry. Once the file is removed or renamed, the next check releases the store again."
K45 = "<b>Doorbell chime independent of the music:</b> A file name in the field <i>Chime</i> is relative to the media store. If the store changes (e.g. from a USB drive to the FRITZ!Box), the file may be missing there - then your own chime plays (tab <i>Audio</i>, uploaded: MP3/OGG/WAV up to 1 MB; kept with the plugin settings, survives an update) or the supplied standard chime (0.4 s of silence, a softly faded-in two-tone, generated by the plugin itself). The doorbell is never silent; the log names the fallback, and the tab <i>Test</i> warns about sources and a chime whose file is missing in the store."
K46 = "<b>File types of the media store:</b> Folders, M3U lists and file sources play <tt>.mp3</tt>, <tt>.m4a</tt>, <tt>.aac</tt>, <tt>.flac</tt>, <tt>.ogg</tt>, <tt>.oga</tt>, <tt>.opus</tt>, <tt>.wav</tt>, <tt>.webm</tt> and <tt>.mp4</tt>. For <tt>.mp4</tt> the speaker plays the sound (AAC) - for videos only the sound, there is no picture. The number of audio files on the <i>Audio</i> tab counts <tt>.mp4</tt> too; other files (e.g. <tt>.mkv</tt>, <tt>.m4v</tt>, images) are skipped by the service. Your own chime stays MP3, OGG or WAV."
K47 = "<b>Commands of a zone or a speaker</b> (<tt>…/befehl/zone_&lt;No&gt;/…</tt> or <tt>…/befehl/&lt;command name&gt;/…</tt>): <tt>quelle</tt> (number, <tt>0</tt> stops), <tt>play</tt>, <tt>pause</tt>, <tt>stop</tt>, <tt>quit</tt>, <tt>next</tt> (next track), <tt>prev</tt> (previous track), <tt>seek</tt>, <tt>volume</tt>, <tt>volume_step</tt>, <tt>volume_up</tt>, <tt>volume_down</tt>, <tt>mute</tt>, <tt>play_favorit</tt>, <tt>tts</tt>, <tt>tts_stop</tt>, <tt>klingel</tt>; plus <tt>…/befehl/klingel</tt> (default target) and <tt>…/befehl/sperre</tt>. The next track is <tt>next</tt>, the previous one <tt>prev</tt> – German words such as „weiter“ are unknown to the command bridge (log: “unknown command”)."
K48 = "<b>Doorbell while music plays, re-created group, hanging network share (since 1.3.26):</b> If a member of the doorbell group is playing something that can be resumed, the service stops it before the chime (until it reports “IDLE”, at most 1.2 s) – so the chime sounds on all speakers at once; afterwards it plays on. This applies with the tick “Resume what was playing after the announcement”. If a group is deleted and created again in Google Home, the service drops the old connection after 60 s or two failures and searches the group again by its name; a doorbell searches once at once (at most 2 s), otherwise the fallback takes over. It rings all last known members, also those not connected right now. If the network share of the media store hangs (“stale file handle”, e.g. after unplugging and replugging the SSD on the FRITZ!Box), the <i>Test</i> tab reports it with the remedy, <tt>server/ablage_ok</tt> becomes 0, and a list or file source reports “Wiedergabe kam nicht zustande” instead of “gestartet”. Once the share is readable again, the service releases the store by itself."
