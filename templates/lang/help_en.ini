; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Chromecast 4 Lox NG"
K02 = "Controls Google Cast devices from the Loxone Miniserver – Chromecast, Google Home and Nest; for the Google Home Speaker Google Cast is not measured – and reports their state back: volume, playback, title, artist and more. The path to the Miniserver is MQTT."
K03 = "Set up in four steps"
K04 = "<i>Test</i> tab → <i>Search for Chromecasts on the network</i>. This gives you the names as the device itself reports them."
K05 = "<i>Settings</i> tab: enter the names, one per line, and save. The service restarts as you do so."
K06 = "<i>Loxone integration</i> tab: download both templates."
K07 = "In Loxone Config: right-click the Miniserver → <i>Paste template</i> — once per file."
K08 = "The name has to be right"
K09 = "The plugin finds the device by its <b>display name</b>, exactly as it appears in the Google Home app. A typo or a device renamed later means nothing happens at all — the log then says <tt>Chromecast '…' not found</tt>. After renaming, the name has to be updated here and the Loxone template regenerated, because the MQTT topic changes with it."
K10 = "The search finds nothing"
K11 = "Chromecasts announce themselves by mDNS on the local network. That does <b>not</b> cross network or VLAN boundaries. If the LoxBerry sits in a different segment from the speakers, the search finds nothing — and opening individual ports on the firewall does not change that. Other causes: the device has no power, has just restarted, or UDP 5353 is blocked."
K12 = "Starting playback"
K13 = "The <tt>play</tt> command expects the <b>direct URL</b> of a medium as its payload, for example the MP3 stream of a radio station. A playlist file (<tt>.m3u</tt>, <tt>.pls</tt>) is not understood by the Chromecast — you have to enter the stream address contained inside it. Without a payload, <tt>play</tt> resumes paused playback."
K14 = "MQTT or UDP"
K15 = "<b>MQTT is the recommended way.</b> Retained, i.e. back at once after a restart of the Miniserver, are <tt>state</tt>, <tt>playing</tt>, <tt>volume</tt>, <tt>muted</tt>, <tt>duration</tt>, <tt>type</tt>, <tt>group</tt>, <tt>favorit</tt> and <tt>tts_active</tt>, plus <tt>server/online</tt> and <tt>server/fassung</tt>. Not retained are <tt>online</tt>, <tt>app</tt>, <tt>title</tt>, <tt>artist</tt>, <tt>album</tt>, <tt>position</tt> and <tt>last_error</tt>, and the sign of life <tt>server/ts</tt>, <tt>server/zaehler</tt>, <tt>server/geraete</tt> and <tt>server/verluste</tt>. Whether the service is alive is told by <tt>server/online</tt> (last will) and <tt>server/zaehler</tt> — not by the <tt>online</tt> of a speaker. The Miniserver sends commands to the UDP input of the MQTT gateway, and the gateway turns them into MQTT; a command sent retained is discarded, not executed, and on connecting it is deleted at the broker and read back; whatever is still there after three attempts is named on the <i>Test</i> tab. Over MQTT every command needs a value (e.g. 1); an empty message is never executed. An absolute volume (<tt>volume</tt>) that was already set to the same effective value less than 60 s ago is not sent again (log: <tt>UNVERAENDERT=1</tt>); steps, louder/quieter, <tt>mute</tt> and buttons always go out."
K16 = "The <b>UDP path</b> is the way of the original version and is kept. It accepts text commands directly and needs no gateway — but only from the Miniservers in the LoxBerry settings and from this LoxBerry itself; everything else is discarded and noted in the log."
K17 = "What has changed since 0.2.31"
K18 = "The service runs under <b>Python 3</b>. The old version was Python 2 and would no longer start at all on LoxBerry 4."
K19 = "Control goes through <b>pychromecast</b> instead of the bundled Go binary. There was no arm64 build of that."
K20 = "<b>Several devices</b> instead of exactly one."
K21 = "The service runs as the user <tt>loxberry</tt>, no longer as <tt>root</tt>."
K22 = "Origin and licence"
K23 = "The basis is the plugin <b>Chromecast 4 Lox</b> by <b>Aleš Berka (Aleq)</b>, version 0.2.31, under the Apache licence 2.0 (<a href='http://aleq.eu/chromecast4lox/' target='_blank'>aleq.eu/chromecast4lox</a>). The original has been unmaintained since 2022."
K24 = "Since 1.2.1 this continuation is called <b>Chromecast 4 Lox NG</b> and has an identifier of its own, so that LoxBerry can tell it apart from the original and bug reports do not end up with the original author. The MQTT topic prefix and the UDP port are unchanged — so nothing needs adjusting on the Loxone side. The complete list of changes is in the file <tt>NOTICE</tt>."
K25 = "Speech output for other plugins"
K26 = "Off by default. Switched on (<i>Settings</i> tab, with its own speech token), other plugins on this LoxBerry can make an announcement on Google speakers – with <b>the same interface as Alexa-NG</b>: POST to <tt>/plugins/&lt;folder&gt;/index.php</tt> with <tt>aktion=sprechen</tt>, <tt>token</tt>, <tt>geraet</tt>, <tt>text</tt>, <tt>laut</tt>. With the same token they set the volume (<tt>aktion=lautstaerke</tt>, <tt>wert</tt> 0 to 100) and read the device list (<tt>aktion=geraete</tt>). Only calls from this LoxBerry itself are accepted. The answer <tt>SPRECHEN;OK=1;…;GRUND=EINGEREIHT</tt> means: the running service has queued the announcement for the connected speakers. Quiet hours, volume limit, chime and resume apply as for announcements from Loxone; at most 60 calls per hour (adjustable), the same text to the same device within 30 s is not repeated. The speech token is treated like a password: never shown, not in the backup. Details in the <i>Integration in Loxone</i> tab; the <i>Test</i> tab has a line for it and the button <i>Test announcement</i>."
K27 = "Lock from Loxone"
K28 = "Off by default (tick in the <i>Settings</i> tab). With it Loxone holds announcements, for example when away, with guests or at night: <tt>&lt;prefix&gt;/server/cmd/sperre</tt> with 1 locks, with 0 unlocks - via the UDP input of the MQTT gateway or as UDP command <tt>server/SPERRE 1;</tt>; other plugins use <tt>aktion=sperre</tt> with the speech token. While locked, announcements from Loxone and through the speech output for other plugins are skipped; there <tt>dringend=1</tt> gets through. Music and volume stay free. After an update open applies until Loxone locks again; the <i>Test</i> tab shows the state."
K29 = "Google ↔ Loxone"
K30 = "<b>Loxone → Google, with this plugin:</b> announcements on one device, a Google speaker group or all, with their own volume; volume, playback, favourites (radio addresses), stop and the state with title and artist over MQTT or UDP; the speech output for other plugins with the same interface as Alexa-NG; the lock from Loxone. Devices: Chromecast, Google Home and Nest, TVs with Chromecast built-in. For the <b>Google Home Speaker</b> Google's data sheet does not list Google Cast; whether it can be addressed as an announcement target is not measured. This plugin has not yet been measured on a real Google device."
K31 = "<b>Google → Loxone and Google routines:</b> not with this plugin but through the Matter bridge in <b>Matter2Lox</b>. It is work in progress; pairing with Google is not measured yet. For a bridge with a test vendor ID Google requires a project in the <i>Google Home Developer Console</i> (VID 0xFFF1, PID 0x8000), and whoever pairs must be a member of that project. The Matter hub is a Google device in the house, according to Google's help among others Nest Audio, Nest Mini, Nest Hub, Google TV Streamer and the <b>Google Home Speaker</b> - for it the Google Store tech specs state that it can be used as a hub for Matter with Google Home."
K32 = "<b>What Google Home automations are then meant to do (not measured):</b> Loxone flips a switch of the bridge, and an automation in the Google Home app then starts a broadcast to the Google speakers, a voice command or a routine. The other way round a sentence of your own (Hey Google, evening light) starts an automation that flips a switch of the bridge - Loxone sees it."
K33 = "<b>Not intended:</b> Chromecasts and Google speakers as Matter media devices - Alexa and Apple Home do not serve this device type, and Google knows the devices anyway. There is no connection to the Google cloud. For Alexa or Apple households the Loxone blocks music and volume can be shared as an outlet through the bridge (nothing shared by default, not measured); do not share them with Google, otherwise every speaker would appear twice in the Google Home app."
