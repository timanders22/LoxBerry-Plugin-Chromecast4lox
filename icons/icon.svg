<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Screen / TV Display Frame -->
    <rect x="156" y="105" width="200" height="150" rx="18" fill="none" stroke="#ffffff" stroke-width="16" />
    
    <!-- TV Base / Stand -->
    <rect x="226" y="258" width="60" height="12" rx="6" fill="#ffffff" />
    <path d="M 216 270 L 296 270" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Cast Symbol Arcs inside Screen Cutout -->
    <!-- Solid Dot -->
    <circle cx="192" cy="225" r="8" fill="#ffffff" />
    
    <!-- Inner Arc -->
    <path d="M 192 201 A 24 24 0 0 1 216 225" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    
    <!-- Outer Arc -->
    <path d="M 192 181 A 44 44 0 0 1 236 225" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Left Symbol: Music / Audio Stream -->
    <g transform="translate(118, 180)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" />
      <path d="M -2 8 L -2 -4 L 6 -7 L 6 5 M -5 8 A 3 3 0 1 0 -2 8 M 3 5 A 3 3 0 1 0 6 5" fill="none" stroke="#6dac20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right Symbol: Video / Streaming Play -->
    <g transform="translate(394, 180)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" />
      <polygon points="-4,-8 8,0 -4,8" fill="#6dac20" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Chromecast4Lox</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
